async function syncNow(manual){
 if(!cfgOK()){if(manual)toast('Cloud sync is not set up yet (Backup & Sync page).',true);return}
 if(!navigator.onLine){renderStatus();if(manual)toast('Internet is off. Data is safe on this computer and will sync later.',true);return}
 if(!ckey()&&location.protocol!=='file:'){if((manual||!keyAsked)&&askKey()){}else{syncMsg='Clinic key needed for sync';renderStatus();const lw=$('lwait');if(lw&&!$('ckin'))lw.innerHTML='<b>Clinic Key needed (only once on this computer)</b><br><input id="ckin" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Paste Clinic Key here" style="width:100%;margin:6px 0;padding:8px" onkeydown="if(event.key===\'Enter\')saveCkey()"><button class="btn g" type="button" id="ckbtn" onclick="saveCkey()">Save key</button>';return}}
 if(syncing)return;syncing=true;syncMsg='Syncing…';renderStatus();let pulled=0;const newTk=[];
 try{
  if(!M.autoPushed&&location.protocol!=='file:'){SYNCED.forEach(st=>D[st].forEach(o=>{M.dirty[st+'|'+o.id]=o._u||1}));M.autoPushed=true;saveMeta()}
  if(!reconciledOnce&&location.protocol!=='file:'){reconciledOnce=true;
   ['users','doctors','tests'].forEach(st=>D[st].forEach(o=>{if((o._u||0)>0)M.dirty[st+'|'+o.id]=o._u}));
   try{const r0=await sbFetch('summary');if(r0.ok){const sm=await r0.json();['bills','patients','tokens','audit'].forEach(st=>{const have=(sm[st]&&sm[st].count)||0;if(D[st].length>have)D[st].forEach(o=>{M.dirty[st+'|'+o.id]=o._u||1})})}}catch(e){}
   saveMeta()}
  const keys=Object.keys(M.dirty);
  for(let i=0;i<keys.length;i+=100){
   const chunk=keys.slice(i,i+100),rows=[],sent={};
   chunk.forEach(k=>{const [st,id]=k.split('|');const o=(D[st]||[]).find(x=>x.id===id);if(o){rows.push({store:st,id:id,data:o,updated_at:o._u||1});sent[k]=o._u}else delete M.dirty[k]});
   if(rows.length){const r=await sbFetch('records',{method:'POST',body:JSON.stringify(rows)});if(!r.ok)throw new Error('Upload failed ('+r.status+')')}
   Object.keys(sent).forEach(k=>{const [st,id]=k.split('|');const o=D[st].find(x=>x.id===id);if(!o||o._u===sent[k])delete M.dirty[k]});
  }
  for(let loop=0;loop<200;loop++){
   const r=await sbFetch('records?since='+(M.lastPull||0)+'&limit=500');
   if(!r.ok)throw new Error('Download failed ('+r.status+')');
   const rows=await r.json();if(!rows.length)break;
   rows.forEach(row=>{const st=row.store;if(!D[st])return;const loc=D[st].find(x=>x.id===row.id);const o=row.data;const ru=o._u||row.updated_at;o._u=ru;if(!loc||(loc._u||0)<ru){if(st==='tokens'&&!loc&&o.status==='unpaid'&&o.date===ymd()&&(o.createdAt||0)>Date.now()-15*60000)newTk.push(o);upsert(st,o);idbPut(st,o);pulled++}if(row.updated_at>(M.lastPull||0))M.lastPull=row.updated_at});
   if(rows.length<500)break;
  }
  M.lastSync=Date.now();syncMsg='';applyShared();saveMeta();
  if(ME&&!D.users.find(u=>u.id===ME.id&&u.active!==false)){ME=null}
  else if(ME){ME=D.users.find(u=>u.id===ME.id)}
  if(manual)toast(pulled?('Synced. '+pulled+' new/updated records received.'):'Synced. Everything is up to date.');
  if(newTk.length&&ME&&can('tokens')){newTk.forEach(t=>toast('🔔 New token #'+t.no+' — '+t.name+' ('+t.doctorName+')'));beep()}
  if(pulled)refreshBadge();
  if(!ME)refreshLoginUsers();else if(pulled&&(page==='dashboard'||page==='tokens'))render();
 }catch(e){syncMsg='Sync error: '+(e.message||e);if(manual)toast(syncMsg,true);const lw=$('lwait');if(lw&&!M.lastSync)lw.textContent='Cannot reach the server. Check internet and reload this page.'}
 finally{syncing=false;saveMeta();renderStatus()}
}

function restoreFile(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{
  let j;try{j=JSON.parse(rd.result)}catch(e){toast('This file is not a valid backup.',true);return}
  if(j.app!==BRAND.app||!j.data){toast('This is not a '+BRAND.name+' backup file.',true);return}
  const mode=(document.querySelector('input[name=rmode]:checked')||{}).value||'merge';
  const cnt=Object.keys(D).reduce((s,k)=>s+(j.data[k]||[]).length,0);
  if(!confirm((mode==='replace'?'REPLACE all data on this computer with':'MERGE')+' the backup of '+new Date(j.ts).toLocaleString()+' ('+cnt+' records)?'))return;
  for(const st of Object.keys(D)){
   if(mode==='replace'){D[st]=[];await idbClear(st)}
   (j.data[st]||[]).forEach(r=>{const loc=D[st].find(x=>x.id===r.id);if(!loc||(loc._u||0)<(r._u||0)||mode==='replace'){upsert(st,r);idbPut(st,r);M.dirty[st+'|'+r.id]=r._u||1}});
  }
  Object.keys(j.counters||{}).forEach(k=>{M.counters[k]=Math.max(M.counters[k]||0,j.counters[k])});
  saveMeta();log('Restore backup',f.name,mode+' · '+cnt+' records');toast('Backup restored.');schedSync();
  if(!D.users.find(u=>u.id===ME.id)){ME=null}else ME=D.users.find(u=>u.id===ME.id);render();
 };rd.readAsText(f);inp.value='';
}

function commBulk(){const q=TQ.trim().toLowerCase(),a=D.tests.filter(t=>(!TC||cat(t.name)===TC)&&tmatch(t.name,q));
 modal(`<h2>Commission ek saath lagao</h2><p style="margin-top:0">Abhi list me dikh rahe <b>${a.length}</b> tests${TC?' ('+esc(TC)+')':''} par lagega. Pehle Category / Search se list chhoti kar lo.</p><div class="g2"><label class="f">Doctor commission (₹ ya %)<input id="cb_cd" placeholder="jaise 20% ya 100"></label><label class="f">Agent commission (₹ ya %)<input id="cb_ca" placeholder="jaise 10% ya 50"></label></div><div class="muted" style="font-size:12px;margin-top:6px">Khali box ka matlab: woh wala nahi badlega. "0" likho to commission zero.</div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="commBulkGo()">Lagao</button></div>`)}
function commBulkGo(){const q=TQ.trim().toLowerCase(),a=D.tests.filter(t=>(!TC||cat(t.name)===TC)&&tmatch(t.name,q)),cv=x=>{x=String(x||'').trim().replace(/\s/g,'');return /^\d+(\.\d+)?%?$/.test(x)?x:null},cd=cv($('cb_cd').value),ca=cv($('cb_ca').value);

 a.forEach(t=>{const o=Object.assign({},t);if(cd!=null)o.cd=cd;if(ca!=null)o.ca=ca;put('tests',o)});log('Commission bulk',TC||'all',a.length+' tests · Dr '+(cd??'-')+' · Agent '+(ca??'-'));closeModal();toast('Ho gaya: '+a.length+' tests.');drawTests()}

 const old=id?D.tests.find(x=>x.id===id):null;const cv=x=>{x=String(x||'').trim().replace(/\s/g,'');return /^\d+(\.\d+)?%?$/.test(x)?x:''};const o=Object.assign({id:id||'t'+uid()},old||{},{name,rate,active:$('t_act').checked,cd:cv($('t_cd').value),ca:cv($('t_ca').value)});put('tests',o);

/* ---------- reports (admin) ---------- */
function setRange(k){const n=new Date();let f,t=ymd(n);
 if(k==='today')f=t;else if(k==='week'){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7));f=ymd(d)}
 else if(k==='month')f=ymd(new Date(n.getFullYear(),n.getMonth(),1));
 else{f=ymd(new Date(n.getFullYear(),n.getMonth()-1,1));t=ymd(new Date(n.getFullYear(),n.getMonth(),0))}
 RF={from:f,to:t};views.reports()}
views.reports=function(){
 if(!RF.from)RF={from:ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1)),to:ymd()};
 $('view').innerHTML=`<div class="card"><div class="row"><label class="f">From<input type="date" value="${RF.from}" onchange="RF.from=this.value;drawReport()"></label><label class="f">To<input type="date" value="${RF.to}" onchange="RF.to=this.value;drawReport()"></label>
 <button class="btn l s" onclick="setRange('today')">Today</button><button class="btn l s" onclick="setRange('week')">This week</button><button class="btn l s" onclick="setRange('month')">This month</button><button class="btn l s" onclick="setRange('last')">Last month</button>
 <button class="btn g" style="margin-left:auto" onclick="exportCSV()">Download CSV (Excel)</button></div></div><div id="rep"></div>`;drawReport();
};
function drawReport(){
 const a=D.bills.filter(b=>!b._del&&b.billDate>=RF.from&&b.billDate<=RF.to);
 const pts=new Set(a.map(b=>b.pid)).size,newP=D.patients.filter(p=>p.created>=RF.from&&p.created<=RF.to).length;
 const opdB=a.filter(b=>b.doctorId&&b.type!=='LAB'),labB=a.filter(b=>b.type!=='OPD'&&b.items.length);
 const opdInc=opdB.reduce((s,b)=>s+b.fee,0),labInc=labB.reduce((s,b)=>s+b.items.reduce((x,i)=>x+num(i.r),0),0),disc=a.reduce((s,b)=>s+b.disc,0),billed=a.reduce((s,b)=>s+b.total,0),due=a.reduce((s,b)=>s+b.due,0),coll=collection(RF.from,RF.to);
 const days={};a.forEach(b=>{(days[b.billDate]=days[b.billDate]||[]).push(b)});
 const dayKeys=Object.keys(days).sort();
 const collByDay={};D.bills.forEach(b=>{if(b._del)return;(b.pays||[]).forEach(p=>{if(p.d>=RF.from&&p.d<=RF.to)collByDay[p.d]=(collByDay[p.d]||0)+p.a})});
 const allDays=[...new Set([...dayKeys,...Object.keys(collByDay)])].sort();
 const docRows=D.doctors.map(d=>{const x=opdB.filter(b=>b.doctorId===d.id);return{d,n:new Set(x.map(b=>b.pid)).size,bills:x.length,fee:x.reduce((s,b)=>s+b.fee,0)}}).filter(r=>r.bills).sort((x,y)=>y.fee-x.fee);
 const cats={};labB.forEach(b=>b.items.forEach(i=>{const c=cat(i.n);cats[c]=cats[c]||{n:0,amt:0};cats[c].n++;cats[c].amt+=num(i.r)}));
 const top={};labB.forEach(b=>b.items.forEach(i=>{top[i.n]=(top[i.n]||0)+1}));
 const topA=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,10);
 $('rep').innerHTML=`<div class="stats"><div class="stat s1"><b>${pts}</b><span>Patients</span></div><div class="stat s5"><b>${newP}</b><span>New patients</span></div><div class="stat s2"><b>${opdB.length}</b><span>OPD bills</span></div><div class="stat s3"><b>${labB.length}</b><span>Lab bills</span></div><div class="stat s4"><b>₹ ${inr(coll)}</b><span>Cash collected</span></div><div class="stat" style="background:#9a3b32"><b>₹ ${inr(due)}</b><span>Due on these bills</span></div></div>
 <div class="g3"><div class="card"><h2>Income</h2><div class="kv"><span>OPD fees</span><b>₹ ${inr(opdInc)}</b><span>Lab / X-ray / USG / ECG</span><b>₹ ${inr(labInc)}</b><span>Discount given</span><b>₹ ${inr(disc)}</b><span>Total billed</span><b>₹ ${inr(billed)}</b></div></div>
 <div class="card"><h2>Lab income by type</h2>${Object.keys(cats).length?`<table>${Object.entries(cats).map(([c,v])=>`<tr><td>${c}</td><td class="n">${v.n} tests</td><td class="n">₹ ${inr(v.amt)}</td></tr>`).join('')}</table>`:'<div class="em">No lab tests.</div>'}</div>
 <div class="card"><h2>Most done tests</h2>${topA.length?`<table>${topA.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${x[1]}</td></tr>`).join('')}</table>`:'<div class="em">No lab tests.</div>'}</div></div>
 <div class="card"><h2>Doctor-wise performance</h2>${docRows.length?`<div class="tw"><table><tr><th>Doctor</th><th class="n">Patients</th><th class="n">OPD bills</th><th class="n">OPD fees</th><th></th></tr>${docRows.map(r=>`<tr><td>${esc(r.d.name)}<br><span class="muted">${esc(r.d.spec)}</span></td><td class="n">${r.n}</td><td class="n">${r.bills}</td><td class="n">₹ ${inr(r.fee)}</td><td><button class="btn l s" onclick="BF={from:RF.from,to:RF.to,type:'',doc:'${r.d.id}',q:'',due:false};nav('bills')">Bills</button></td></tr>`).join('')}</table></div>`:'<div class="em">No OPD patients in this period.</div>'}</div>
 <div class="card"><h2>Day-wise</h2>${allDays.length?`<div class="tw"><table><tr><th>Date</th><th class="n">Patients</th><th class="n">Bills</th><th class="n">Billed</th><th class="n">Collected</th><th class="n">Due</th></tr>${allDays.map(k=>{const x=days[k]||[];return`<tr><td>${fd(k)}</td><td class="n">${new Set(x.map(b=>b.pid)).size}</td><td class="n">${x.length}</td><td class="n">${inr(x.reduce((s,b)=>s+b.total,0))}</td><td class="n">${inr(collByDay[k]||0)}</td><td class="n">${inr(x.reduce((s,b)=>s+b.due,0))}</td></tr>`}).join('')}</table></div>`:'<div class="em">No data in this period.</div>'}</div>`;
}
function exportCSV(){
 const a=D.bills.filter(b=>!b._del&&b.billDate>=RF.from&&b.billDate<=RF.to).sort((x,y)=>x.ts-y.ts);
 const h=['Bill No','Date','Time','Type','Patient ID','Patient','Age','Sex','Phone','Doctor','OPD Fee','Tests','Discount','Total','Paid','Due','Created By','Agent'];
 const rows=a.map(b=>[b.no,fd(b.billDate),ftShort(b.ts),typeName(b.type),b.pno,b.title+' '+b.name,ageTxt(b.age),b.sex,b.phone,b.doctorName,b.fee,b.items.map(i=>i.n).join('; '),b.disc,b.total,b.paid,b.due,b.createdBy,b.agentName||'']);
 download(BRAND.file+'_Bills_'+RF.from+'_to_'+RF.to+'.csv','\ufeff'+[h].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');log('Export CSV',RF.from+' to '+RF.to,a.length+' bills')}

 if((m=s.match(/^\s*<\s*=?\s*([\d.]+)/)))return{hi:+m[1]};if((m=s.match(/^\s*>\s*=?\s*([\d.]+)/)))return{lo:+m[1]};

function rpSave(final){
 const filled=RP.sections.some(secHas);
 if(final&&!filled)return toast('Enter at least one result.',true);
 if(final){const bad=dlcBad();if(bad)return toast(bad+' Fix it before Finalize (draft can be saved).',true)}
 const hasP=RP.sections.some(s=>s.kind!=='img'),hasI=RP.sections.some(s=>s.kind==='img');
 if(final&&hasI&&!RP.imgId&&!confirm('No doctor is selected to sign the USG / X-Ray / Echo report. Print without signature?'))return;
 if(final&&hasP&&!RP.pathId&&!confirm('No doctor is selected to sign. Print without a doctor signature?'))return;
 RP.status=final?'final':'draft';if(final){RP.finalBy=ME.name}RP.createdBy=RP.createdBy||ME.name;
 M.lastPath=RP.pathId;M.lastTech=RP.techId;saveMeta();
 put('reports',JSON.parse(JSON.stringify(RP)));log(final?'Report finalized':'Report draft saved',RP.billNo,RP.name);
 toast(final?'Report saved.':'Draft saved.');
 if(final){if(dueOf(RP.billId)>0){toast('Report saved. Due \u20b9 '+inr(dueOf(RP.billId))+' baaki hai, isliye print nahi hoga. Due collect karke Lab Reports se print karein.',true);setTimeout(()=>nav('labreports'),400)}else{const R=JSON.parse(JSON.stringify(RP));nav('labreports');setTimeout(()=>pickPrint(R),150)}}
}
function rpPreview(){const _b=D.bills.find(x=>x.id===RP.billId),_d=_b?num(_b.due):0;modal(`<h2>Preview</h2>${_d>0?`<div class="banner" style="margin-bottom:8px"><span><b>Due \u20b9 ${inr(_d)}</b> \u2014 preview dekh sakte hain, print / WhatsApp due clear hone par hi hoga.</span></div>`:''}<div style="border:1px solid var(--ln);overflow:auto;padding:6px;background:#fff">${reportHTML(RP,true)}</div><div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button></div>`,true)}
function dueOf(billId){const b=D.bills.find(x=>x.id===billId);return b?Math.max(0,num(b.due)):0}
function dueBlock(billId){const d=dueOf(billId);if(d>0){toast('Due \u20b9 '+inr(d)+' baaki hai. Pehle due collect karein, tab report milegi.',true);return true}return false}
function secHas(s){return s.kind==='img'?s.edited!==false&&!!(String(s.findings||'').trim()||String(s.impression||'').trim()):s.rows.some(x=>String(x.v).trim())}
let PP=null;
function pickPrint(r){const ok=r.sections.map((s,i)=>i).filter(i=>secHas(r.sections[i]));if(!ok.length)return toast('Is report me koi result nahi hai.',true);

 ${ok.map(i=>`<label style="display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--ln);font-size:15px"><input type="checkbox" class="ppk" value="${i}" checked style="width:20px;height:20px"> ${esc(r.sections[i].testName)} <span class="muted">\u00b7 ${esc(cat(r.sections[i].testName))}</span></label>`).join('')}

function ppGo(){const sel=[...document.querySelectorAll('.ppk')].filter(x=>x.checked).map(x=>+x.value);if(!sel.length)return toast('Kam se kam ek test select karein.',true);

function repWordGet(billId){if(dueBlock(billId))return;const r=repOf(billId);if(!r||!r.wordFile)return;const a=document.createElement('a');a.href=r.wordFile.data;a.download=r.wordFile.name||'report.doc';document.body.appendChild(a);a.click();a.remove()}

function waReport(billId){if(dueBlock(billId))return;const r=repOf(billId),b=D.bills.find(x=>x.id===billId);if(!r||!b)return;
 const L=['*'+S.clinicName+' '+S.sub+'*','LAB REPORT','Patient: '+r.title+' '+r.name+' ('+ageTxt(r.age)+', '+r.sex+')','Bill No: '+r.billNo,'Date: '+fd(r.reportDate),''];

 r.sections.forEach(s=>{if(s.kind==='img')return;const rows=s.rows.filter(x=>String(x.v).trim());if(!rows.length)return;const dp=String(s.dept).toUpperCase();

  rows.forEach(x=>{const f=flagOf(x.v,x.r);secs+=`<tr><td><div class="n">${esc(x.n)}</div>${x.sp?`<div class="s">Specimen : ${esc(x.sp)}</div>`:''}${x.me?`<div class="s">Method : ${esc(x.me)}</div>`:''}</td><td><b>${esc(x.v)}</b>${f?` <b>${f}</b>`:''}</td><td>${esc(x.u)}</td><td style="white-space:pre-line">${esc(x.r)}</td></tr>`});

function cspec(v){v=String(v==null?'':v).trim();if(v==='')return null;return /%$/.test(v)?{p:num(v.replace('%',''))}:{a:num(v)}}
function commCalc(f,who){const ref=who==='dr'?D.referrers.find(x=>x.id===f.refId&&!isAgent(x)):D.referrers.find(x=>x.id===f.agentId&&isAgent(x));if(!ref)return 0;
 const ct=f.commTo||'auto';if(ct==='none'||(ct==='dr'&&who!=='dr')||(ct==='agent'&&who!=='agent'))return 0;
 const sub=f.items.reduce((s,i)=>s+num(i.r),0)+(f.type==='LAB'?0:num(f.fee)),disc=Math.min(Math.max(num(f.disc),0),sub),k=sub>0?(sub-disc)/sub:1;
 let c=0,any=false;f.items.forEach(i=>{if(i.out)return;any=true;const t=D.tests.find(x=>x.id===i.tid),sp=cspec(t?(who==='dr'?t.cd:t.ca):'');const base=num(i.r)*k;c+=sp?(sp.p!=null?base*sp.p/100:sp.a):base*num(ref.pct)/100});
 if(f.type!=='LAB'&&num(f.fee)>0){any=true;c+=num(f.fee)*k*num(ref.pct)/100}
 return any?Math.round(c+num(ref.flat)):0}
function commFinal(f,who){const ov=who==='dr'?f.commOv:f.acommOv;return ov!==''&&ov!=null?num(ov):commCalc(f,who)}

 const T=a.reduce((s,x)=>({p:s.p+x.pts.size,b:s.b+x.bills.length,t:s.t+x.billed,c:s.c+x.comm,pd:s.pd+x.paid}),{p:0,b:0,t:0,c:0,pd:0});
 el.innerHTML=`<div class="tw"><table><tr><th>Referring doctor</th><th class="n">Patients</th><th class="n">Bills</th><th class="n">Billed \u20b9</th><th class="n">Commission \u20b9</th><th class="n">Paid \u20b9</th><th class="n">Due \u20b9</th><th></th></tr>
 ${a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone||'')}</span></td><td class="n">${x.pts.size}</td><td class="n">${x.bills.length}</td><td class="n">${inr(x.billed)}</td><td class="n"><b>${inr(x.comm)}</b></td><td class="n">${inr(x.paid)}</td><td class="n ${x.comm-x.paid>0?'due':''}">${inr(x.comm-x.paid)}</td>
 <td style="white-space:nowrap"><button class="btn l s" onclick="cmDetail('${x.id}')">Details</button>${x.comm-x.paid>0?` <button class="btn o s" onclick="cmPay('${x.id}')">Mark paid</button>`:''}${x.phone?` <button class="btn s" style="background:#1da851" onclick="cmWa('${x.id}')">WhatsApp</button>`:''}</td></tr>`).join('')}
 <tr style="font-weight:700;background:var(--gl)"><td>Total</td><td class="n">${T.p}</td><td class="n">${T.b}</td><td class="n">${inr(T.t)}</td><td class="n">${inr(T.c)}</td><td class="n">${inr(T.pd)}</td><td class="n">${inr(T.c-T.pd)}</td><td></td></tr></table></div>`}
function cmDetail(id){const x=commRows().find(q=>q.id===id);if(!x)return;
 modal(`<h2>${esc(x.name)} <span class="muted" style="font-size:13px">${fd(CMF.from)} \u2013 ${fd(CMF.to)}</span></h2><div class="tw"><table><tr><th>Date</th><th>Bill</th><th>Patient</th><th>Tests</th><th class="n">Amount</th><th class="n">Commission</th><th>Paid on</th></tr>${x.bills.sort((a,b)=>a.ts-b.ts).map(b=>`<tr><td>${fd(b.billDate)}</td><td>${esc(b.no)}</td><td>${esc(b.title)} ${esc(b.name)}</td><td>${esc(b.items.map(i=>i.n).join(', '))}</td><td class="n">${inr(b.total)}</td><td class="n">${inr(b.comm)}</td><td>${b.commPaidOn?fd(b.commPaidOn):'\u2014'}</td></tr>`).join('')}</table></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button></div>`,true)}
function cmPay(id){const x=commRows().find(q=>q.id===id);if(!x)return;const due=x.bills.filter(b=>!b.commPaidOn&&num(b.comm)>0),amt=due.reduce((s,b)=>s+num(b.comm),0);
 if(!confirm('Mark \u20b9'+inr(amt)+' commission as PAID to '+x.name+' for '+fd(CMF.from)+' \u2013 '+fd(CMF.to)+'?'))return;
 due.forEach(b=>put('bills',Object.assign({},b,{commPaidOn:ymd(),commPaidBy:ME.name})));log('Commission paid',x.name,'\u20b9'+inr(amt)+' ('+fd(CMF.from)+' - '+fd(CMF.to)+')');toast('Marked as paid.');drawComm()}
function cmWa(id){const x=commRows().find(q=>q.id===id);if(!x)return;
 waOpen(x.phone,['*'+S.clinicName+' '+S.sub+'*','Commission statement for '+x.name,fd(CMF.from)+' to '+fd(CMF.to),'','Patients: '+x.pts.size,'Commission: \u20b9'+inr(x.comm),'Paid: \u20b9'+inr(x.paid),'*Due: \u20b9'+inr(x.comm-x.paid)+'*','','Contact: '+S.recPhones])}
function cmCSV(){const h=['Referring doctor','Date','Bill No','Patient','Tests','Bill amount','Commission','Paid on'],rows=[];
 commRows().forEach(x=>x.bills.sort((a,b)=>a.ts-b.ts).forEach(b=>rows.push([x.name,fd(b.billDate),b.no,b.title+' '+b.name,b.items.map(i=>i.n).join('; '),b.total,b.comm||0,b.commPaidOn?fd(b.commPaidOn):''])));
 download(BRAND.file+'_Commission_'+CMF.from+'_to_'+CMF.to+'.csv','\ufeff'+[h].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}

/* ===================== v3: SEARCHABLE PICKERS (doctor / referred-by / agent) ===================== */
const isAgent=r=>!!r&&r.kind==='agent';
const agentCommOf=(id,base)=>{const r=D.referrers.find(x=>x.id===id&&isAgent(x));return r?Math.round(num(base)*num(r.pct)/100+num(r.flat)):0};
// name matching: ignores "DR", "DR.", "Dr " prefixes, dots, spaces and case; matches any part of the name
const pkWords=s=>String(s||'').toLowerCase().split(/[\s.,]+/).filter(w=>w&&w!=='dr'&&w!=='dr.');
const pkNorm=s=>nz(pkWords(s).join(''));
const pkMatch=(name,q)=>{const ws=pkWords(q).map(nz).filter(Boolean);if(!ws.length)return true;const n=pkNorm(name);return ws.every(w=>n.includes(w))};
const pkSort=q=>{const qn=pkNorm(q);return(a,b)=>{const x=qn&&pkNorm(a.t).startsWith(qn)?0:1,y=qn&&pkNorm(b.t).startsWith(qn)?0:1;return x-y}};
const PKC={
 doc:{
  cur:()=>{const d=D.doctors.find(x=>x.id===F.doc);return d?d.name:''},
  opts:q=>{const a=D.doctors.filter(d=>(d.active!==false||d.id===F.doc)&&pkMatch(d.name+' '+(d.spec||''),q)).map(d=>({v:d.id,t:d.name,s:(visitsOn(d)?'● visiting today · ':'')+(d.spec||'')+' · ₹'+inr(d.fee)})).sort(pkSort(q));
   const qt=q.trim(),exact=qt&&D.doctors.some(d=>pkNorm(d.name)===pkNorm(qt));
   if(qt&&!exact&&isAdmin())a.push({add:qt,t:'+ Add "'+qt+'" as new doctor'});
   else if(qt&&!a.length)a.push({nf:1,t:'Doctor not found'+(isAdmin()?'':' — ask Admin to add')});
   return a},
  pick:v=>{pickDoc(v);const e=$('pk_doc');if(e)e.value=PKC.doc.cur()},
  add:name=>{if(!isAdmin())return;const fv=prompt('New doctor: '+name+'\nOPD fee (₹):','300');if(fv===null)return;
   const o={id:'d'+uid(),name,deg:'',spec:'',fee:num(fv),timing:'',slot:10,dow:[],weeks:[],active:true};put('doctors',o);log('Add doctor (from bill)',name,'fee ₹'+inr(o.fee));toast('Doctor added. Edit days / degree later in Doctors.');pickDoc(o.id);drawBilling()}
 },
 ref:{
  cur:()=>{if(F.refId){const r=D.referrers.find(x=>x.id===F.refId);return r?r.name:''}const d=F.doc&&D.doctors.find(x=>x.id===F.doc);return d?d.name:''},
  opts:q=>{const qt=q.trim(),a=[];if(!qt)a.push({v:'',t:'SELF',s:'No referring doctor'});
   const rs=D.referrers.filter(r=>!isAgent(r)&&(r.active!==false||r.id===F.refId)&&pkMatch(r.name,q)).map(r=>({v:'r:'+r.id,t:r.name,s:(r.deg||'Referring doctor')})).sort(pkSort(q));
   const ds=D.doctors.filter(d=>(d.active!==false||d.id===F.doc)&&pkMatch(d.name,q)).map(d=>({v:d.id,t:d.name,s:'Our doctor'+(d.spec?' · '+d.spec:'')})).sort(pkSort(q));
   a.push(...rs,...ds);
   const exact=qt&&(D.referrers.some(r=>!isAgent(r)&&pkNorm(r.name)===pkNorm(qt))||D.doctors.some(d=>pkNorm(d.name)===pkNorm(qt)));
   if(qt&&!exact&&pkNorm(qt))a.push({add:qt,t:'+ Add "'+qt+'" as new referring doctor'});
   return a},
  pick:v=>pickRef(v),
  add:name=>{const o={id:'rf'+uid(),name,deg:'',phone:'',pct:0,flat:0,active:true};put('referrers',o);log('Add referrer (from bill)',name,'0%');toast('Referring doctor added. Admin can set phone / commission later.');pickRef('r:'+o.id)}
 },
 agent:{
  cur:()=>{const r=F.agentId&&D.referrers.find(x=>x.id===F.agentId);return r?r.name:''},
  opts:q=>{const qt=q.trim(),a=[];if(!qt)a.push({v:'',t:'None',s:'No agent'});
   a.push(...D.referrers.filter(r=>isAgent(r)&&(r.active!==false||r.id===F.agentId)&&pkMatch(r.name,q)).map(r=>({v:r.id,t:r.name,s:'Agent'+(r.phone?' · '+r.phone:'')})).sort(pkSort(q)));
   const exact=qt&&D.referrers.some(r=>isAgent(r)&&pkNorm(r.name)===pkNorm(qt));
   if(qt&&!exact&&pkNorm(qt))a.push({add:qt,t:'+ Add "'+qt+'" as new agent'});
   return a},
  pick:v=>pickAgent(v),
  add:name=>{const o={id:'ag'+uid(),kind:'agent',name,phone:'',pct:0,flat:0,active:true};put('referrers',o);log('Add agent (from bill)',name,'0%');toast('Agent added. Admin can set phone / commission later.');pickAgent(o.id)}
 }
};
function pickAgent(id){F.agentId=id||'';drawBilling()}
let PKS={key:'',hi:0,list:[]};
function pkHTML(key,label,ph){return `<div class="f pkw"><label class="f" for="pk_${key}">${label}</label><div class="sugw"><input id="pk_${key}" value="${esc(PKC[key].cur())}" placeholder="${esc(ph||'')}" autocomplete="off" role="combobox" aria-autocomplete="list" onfocus="this.select();pkShow('${key}','')" oninput="pkShow('${key}',this.value)" onkeydown="pkKey(event,'${key}')" onblur="pkBlur('${key}')"><div class="sug" id="pkl_${key}" role="listbox"></div></div></div>`}
function pkShow(key,q){const box=$('pkl_'+key);if(!box)return;const list=PKC[key].opts(String(q||'')).slice(0,60);PKS={key,hi:list.findIndex(x=>!x.nf),list};
 if(!list.length){box.style.display='none';box.innerHTML='';return}
 box.innerHTML=list.map((x,i)=>`<div data-i="${i}" class="${x.add?'pk-add':x.nf?'pk-nf':''}${i===PKS.hi?' hi':''}" role="option" onmousedown="event.preventDefault()" onclick="pkPick('${key}',${i})">${x.add||x.nf?esc(x.t):`<b>${esc(x.t)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}`}</div>`).join('');
 box.style.display='block'}
function pkHi(key,d){const n=PKS.list.length;if(!n)return;let i=PKS.hi;for(let k=0;k<n;k++){i=(i+d+n)%n;if(!PKS.list[i].nf)break}PKS.hi=i;const box=$('pkl_'+key);if(!box)return;[...box.children].forEach((c,j)=>c.classList.toggle('hi',j===i));const el=box.children[i];if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
function pkKey(e,key){const box=$('pkl_'+key),open=box&&box.style.display==='block'&&PKS.key===key;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)pkShow(key,e.target.value===PKC[key].cur()?'':e.target.value);else pkHi(key,e.key==='ArrowDown'?1:-1)}
 else if(e.key==='Enter'){e.preventDefault();if(open&&PKS.hi>=0)pkPick(key,PKS.hi)}
 else if(e.key==='Escape'){if(box)box.style.display='none';e.target.value=PKC[key].cur()}}
function pkPick(key,i){const x=(PKS.key===key?PKS.list:[])[i];if(!x||x.nf)return;const box=$('pkl_'+key);if(box)box.style.display='none';PKS={key:'',hi:0,list:[]};
 if(x.add)PKC[key].add(x.add);else PKC[key].pick(x.v)}
function pkBlur(key){setTimeout(()=>{const box=$('pkl_'+key),inp=$('pk_'+key);if(box)box.style.display='none';if(inp&&document.activeElement!==inp)inp.value=PKC[key].cur()},180)}

/* ===================== v3: AGENTS (master) ===================== */
views.agents=function(){const a=D.referrers.filter(isAgent).sort((x,y)=>x.name.localeCompare(y.name));
 $('view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div class="muted">Agents who bring patients. Agent commission is worked out on every bill where the agent is chosen (separate from the referring doctor's commission). Only Admin can see this.</div><button class="btn g" onclick="agentForm()">+ Add agent</button></div></div>
 <div class="card tw">${a.length?`<table><tr><th>Name</th><th>Phone (WhatsApp)</th><th>Place / note</th><th class="n">Commission</th><th>Status</th><th></th></tr>${a.map(r=>`<tr class="${r.active===false?'del':''}"><td><b>${esc(r.name)}</b></td><td>${esc(r.phone||'')}</td><td>${esc(r.deg||'')}</td><td class="n">${num(r.pct)}%${num(r.flat)?' + \u20b9'+inr(r.flat)+'/bill':''}</td><td>${r.active===false?'Inactive':'Active'}</td><td><button class="btn s" onclick="agentForm('${r.id}')">Edit</button></td></tr>`).join('')}</table>`:'<div class="em">No agents yet.</div>'}</div>`};
function agentForm(id){const r=id?D.referrers.find(x=>x.id===id):{name:'',deg:'',phone:'',pct:0,flat:0,active:true};
 modal(`<h2>${id?'Edit agent':'Add agent'}</h2><div class="g2" style="grid-template-columns:1fr">
 <label class="f">Agent name<input id="ag_name" value="${esc(r.name)}"></label>
 <label class="f">Phone (WhatsApp)<input id="ag_phone" inputmode="tel" value="${esc(r.phone||'')}"></label>
 <label class="f">Place / note (optional)<input id="ag_deg" value="${esc(r.deg||'')}"></label>
 <div class="g2"><label class="f">Commission % of bill amount<input id="ag_pct" type="number" min="0" step="0.5" value="${num(r.pct)}"></label><label class="f">Plus fixed \u20b9 per bill<input id="ag_flat" type="number" min="0" value="${num(r.flat)}"></label></div>
 <div class="muted" style="font-size:12px">Agent commission = bill net amount \u00d7 % + fixed amount per bill. A new rate is used from the next bill (or when a bill is edited).</div>
 <label><input type="checkbox" id="ag_act" ${r.active===false?'':'checked'}>Active</label></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="agentSave('${id||''}')">Save</button></div>`)}
function agentSave(id){const name=$('ag_name').value.trim();if(!name)return toast('Enter the name.',true);
 const old=id?D.referrers.find(x=>x.id===id):{};put('referrers',Object.assign({id:id||'ag'+uid()},old,{kind:'agent',name,deg:$('ag_deg').value.trim(),phone:$('ag_phone').value.trim(),pct:num($('ag_pct').value),flat:num($('ag_flat').value),active:$('ag_act').checked}));
 log(id?'Edit agent':'Add agent',name,num($('ag_pct').value)+'% + \u20b9'+num($('ag_flat').value));closeModal();views.agents()}

/* ---------- v3: agent commission report (shown under the referring-doctor commission) ---------- */
function agentRows(){const m={};D.bills.forEach(b=>{if(b._del||!b.agentId||b.billDate<CMF.from||b.billDate>CMF.to)return;const x=m[b.agentId]=m[b.agentId]||{id:b.agentId,bills:[],pts:new Set(),billed:0,comm:0,paid:0};x.bills.push(b);x.pts.add(b.pid);x.billed+=b.total;x.comm+=num(b.agentComm);if(b.agentCommPaidOn)x.paid+=num(b.agentComm)});
 return Object.values(m).map(x=>{const r=D.referrers.find(q=>q.id===x.id);x.name=r?r.name:(x.bills[0].agentName||'');x.phone=r?r.phone:(x.bills[0].agentPhone||'');return x}).sort((a,b)=>b.comm-a.comm)}
function drawAgentComm(){const a=agentRows(),el=$('agtable');if(!el)return;
 if(!a.length){el.innerHTML='<div class="em">No agent bills in this period.</div>';return}
 const T=a.reduce((s,x)=>({p:s.p+x.pts.size,b:s.b+x.bills.length,t:s.t+x.billed,c:s.c+x.comm,pd:s.pd+x.paid}),{p:0,b:0,t:0,c:0,pd:0});
 el.innerHTML=`<div class="tw"><table><tr><th>Agent</th><th class="n">Patients</th><th class="n">Bills</th><th class="n">Billed \u20b9</th><th class="n">Commission \u20b9</th><th class="n">Paid \u20b9</th><th class="n">Due \u20b9</th><th></th></tr>
 ${a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone||'')}</span></td><td class="n">${x.pts.size}</td><td class="n">${x.bills.length}</td><td class="n">${inr(x.billed)}</td><td class="n"><b>${inr(x.comm)}</b></td><td class="n">${inr(x.paid)}</td><td class="n ${x.comm-x.paid>0?'due':''}">${inr(x.comm-x.paid)}</td>
 <td style="white-space:nowrap"><button class="btn l s" onclick="agDetail('${x.id}')">Details</button>${x.comm-x.paid>0?` <button class="btn o s" onclick="agPay('${x.id}')">Mark paid</button>`:''}${x.phone?` <button class="btn s" style="background:#1da851" onclick="agWa('${x.id}')">WhatsApp</button>`:''}</td></tr>`).join('')}
 <tr style="font-weight:700;background:var(--gl)"><td>Total</td><td class="n">${T.p}</td><td class="n">${T.b}</td><td class="n">${inr(T.t)}</td><td class="n">${inr(T.c)}</td><td class="n">${inr(T.pd)}</td><td class="n">${inr(T.c-T.pd)}</td><td></td></tr></table></div>`}
function agDetail(id){const x=agentRows().find(q=>q.id===id);if(!x)return;
 modal(`<h2>Agent: ${esc(x.name)} <span class="muted" style="font-size:13px">${fd(CMF.from)} \u2013 ${fd(CMF.to)}</span></h2><div class="tw"><table><tr><th>Date</th><th>Bill</th><th>Patient</th><th>Type</th><th class="n">Amount</th><th class="n">Commission</th><th>Paid on</th></tr>${x.bills.sort((a,b)=>a.ts-b.ts).map(b=>`<tr><td>${fd(b.billDate)}</td><td>${esc(b.no)}</td><td>${esc(b.title)} ${esc(b.name)}</td><td>${typeTag(b.type,b)}</td><td class="n">${inr(b.total)}</td><td class="n">${inr(b.agentComm)}</td><td>${b.agentCommPaidOn?fd(b.agentCommPaidOn):'\u2014'}</td></tr>`).join('')}</table></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button></div>`,true)}
function agPay(id){const x=agentRows().find(q=>q.id===id);if(!x)return;const due=x.bills.filter(b=>!b.agentCommPaidOn&&num(b.agentComm)>0),amt=due.reduce((s,b)=>s+num(b.agentComm),0);
 if(!confirm('Mark \u20b9'+inr(amt)+' agent commission as PAID to '+x.name+' for '+fd(CMF.from)+' \u2013 '+fd(CMF.to)+'?'))return;
 due.forEach(b=>put('bills',Object.assign({},b,{agentCommPaidOn:ymd(),agentCommPaidBy:ME.name})));log('Agent commission paid',x.name,'\u20b9'+inr(amt)+' ('+fd(CMF.from)+' - '+fd(CMF.to)+')');toast('Marked as paid.');drawAgentComm()}
function agWa(id){const x=agentRows().find(q=>q.id===id);if(!x)return;
 waOpen(x.phone,['*'+S.clinicName+' '+S.sub+'*','Commission statement for '+x.name,fd(CMF.from)+' to '+fd(CMF.to),'','Patients: '+x.pts.size,'Commission: \u20b9'+inr(x.comm),'Paid: \u20b9'+inr(x.paid),'*Due: \u20b9'+inr(x.comm-x.paid)+'*','','Contact: '+S.recPhones])}
function agCSV(){const h=['Agent','Date','Bill No','Patient','Type','Bill amount','Agent commission','Paid on'],rows=[];
 agentRows().forEach(x=>x.bills.sort((a,b)=>a.ts-b.ts).forEach(b=>rows.push([x.name,fd(b.billDate),b.no,b.title+' '+b.name,billKind(b),b.total,b.agentComm||0,b.agentCommPaidOn?fd(b.agentCommPaidOn):''])));
 download(BRAND.file+'_Agent_Commission_'+CMF.from+'_to_'+CMF.to+'.csv','\ufeff'+[h].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}

/* ---------- start ---------- */
async function init(){
 idb=await openDB();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 for(const s of ['doctors','tests','bills','patients','users','audit','tokens','reports','signers','config','referrers'])D[s]=await idbAll(s);
 const st=await idbAll('settings');S=Object.assign(defaultSettings(),st[0]||{});applyShared();
 const mt=await idbAll('meta');M=Object.assign({id:'meta',counters:{},dirty:{},lastPull:0,lastBackup:0,seeded:false,lastSync:0},mt[0]||{});
 if(M.syncV!==2){M.syncV=2;M.lastPull=0;saveMeta()}
 if(!M.seeded&&!D.users.length)seed();else if(!M.seeded){M.seeded=true;saveMeta()}
 ensureUsgDocs();if(!D.tests.some(t=>/ECHO/i.test(t.name)))put('tests',{id:'t-echo',name:'ECHOCARDIOGRAPHY',rate:0,active:true});
 if(!M.labSeeded){M.labSeeded=true;if(D.users.length&&!D.users.some(u=>u.role==='lab'))put('users',{id:'u-lab',name:'LAB',role:'lab',pin:hp('2222'),active:true});saveMeta()}
 saveSettings();
 let sid=null;try{sid=sessionStorage.getItem('glu')}catch(e){}
 ME=D.users.find(u=>u.id===sid&&u.active!==false)||null;
 window.addEventListener('online',()=>{renderStatus();syncNow()});window.addEventListener('offline',renderStatus);
 setInterval(()=>syncNow(),location.protocol==='file:'?30000:8000);
 render();syncNow();
}
init();
