<style>

<script>
const SB=supabase.createClient('https://ochdzpcxrhlzloxbnzua.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jaGR6cGN4cmhsemxveGJuenVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODMyNDgsImV4cCI6MjEwOTA1OTI0OH0.ydBBoTuNF1qsQMYN0LMS4GZbie98iZ60Bj0et0-jWcw',{auth:{persistSession:false}});

function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',3500)}
const ERR={WRONG_LOGIN:'Wrong Shop ID or password',BLOCKED:'This shop is blocked. Please contact UltraAccounting.',EXPIRED:'Plan expired',LOGIN_EXPIRED:'Please log in again',WRONG_OLD_PASSWORD:'Old password is wrong',PASSWORD_TOO_SHORT:'Password must be at least 6 characters'};
async function rpc(fn,args){const {data,error}=await SB.rpc(fn,args);if(error){const k=(error.message||'').trim();if(k==='EXPIRED'||k==='BLOCKED'){await payView(k);throw new Error('stop')}if(k==='LOGIN_EXPIRED'){logout(true);throw new Error('stop')}throw new Error(ERR[k]||k)}return data}
// ---------- crypto ----------
const te=new TextEncoder(),td=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);const o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return b64(o)}
async function dec(key,s){const a=ub64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12)))}
async function dkKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
function recCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(16));let s='';r.forEach((v,i)=>{s+=A[v%A.length];if(i%4==3&&i<15)s+='-'});return s}
// ---------- state ----------
let S=null,DK=null,DKRAW=null,CUST=[],CUR=null;
const DEF={branch:'',ifsc:'',baddr1:'',baddr2:'',baddr3:'',micr:'',bemail:'',pw:150,ph:210,ff:"'Courier New',monospace",fs:10,bold:true,top:12,left:6,colgap:48};
const SETK=()=>Object.assign({},DEF,S.settings||{});
const store=()=>localStorage.getItem('pb_keep')==='1'?localStorage:sessionStorage;
function saveSess(){store().setItem('pb_sess',JSON.stringify({S,dk:b64(DKRAW)}))}
async function restore(){const j=localStorage.getItem('pb_sess')||sessionStorage.getItem('pb_sess');if(!j)return false;try{const o=JSON.parse(j);S=o.S;DKRAW=ub64(o.dk);DK=await dkKey(DKRAW);return true}catch(e){return false}}
function logout(silent){if(S&&!silent)SB.rpc('pb_logout',{p_token:S.token});localStorage.removeItem('pb_sess');sessionStorage.removeItem('pb_sess');S=null;DK=null;loginView();if(silent)toast('Please log in again')}
// ---------- views ----------
function hdr(){if(!S){$('ttl').textContent='UltraAccounting · Passbook';$('days').innerHTML='';$('hb').innerHTML='';return}
 $('ttl').textContent=S.name+' · Passbook';let d='';if(S.valid_until){const n=Math.round((new Date(S.valid_until+'T23:59:59')-new Date())/864e5);d=`<span class="chip ${n<0?'x':n<=7?'w':''}">${n<0?'Plan expired':n+' days left'}</span>`}$('days').innerHTML=d;
 $('hb').innerHTML=`<button class="s" onclick="listView()">Customers</button> <button class="s" onclick="setView()">Settings</button> <button class="s" onclick="bkView()">Excel / Backup</button> <button class="s" onclick="logout()">Logout</button>`}
function loginView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:400px;margin:40px auto"><h2 style="margin-top:0">Shop login</h2>
 <label>Shop ID<input id="lc" autocomplete="username"></label><label style="margin-top:8px">Password<input id="lp" type="password" autocomplete="current-password"></label>
 <label style="margin-top:8px;display:flex;gap:6px;align-items:center;color:#333"><input type="checkbox" id="lk" style="width:auto" checked> Keep me logged in on this computer</label>
 <div style="margin-top:10px"><button onclick="doLogin()">Login</button></div><p class="muted">Shop ID and password are given by the Owner, UltraAccounting.<br>Call / WhatsApp: <a href="tel:+917602292599">7602292599</a></p></div>`;
 $('lp').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
let LPASS='';
async function doLogin(){const c=$('lc').value.trim().toLowerCase(),p=$('lp').value;if(!c||!p)return;localStorage.setItem('pb_keep',$('lk').checked?'1':'0');
 try{S=await rpc('pb_login',{p_code:c,p_pass:p})}catch(e){if(e.message!=='stop')toast(e.message);return}LPASS=p;
 if(S.must_change&&!S.wrap_pw)return firstView();
 if(S.must_change)return resetView();
 try{DKRAW=await dec(await kdf(p,'pw:'+S.code),S.wrap_pw);DK=await dkKey(DKRAW)}catch(e){toast('Could not unlock data');return}
 saveSess();start()}
function firstView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2 style="margin-top:0">First time: set your password</h2>
 <label>New password (min 6 characters)<input id="n1" type="password"></label><label style="margin-top:8px">Confirm password<input id="n2" type="password"></label>
 <div style="margin-top:10px"><button onclick="doFirst()">Save</button></div></div>`}
async function doFirst(){const a=$('n1').value,b=$('n2').value;if(a.length<6)return toast(ERR.PASSWORD_TOO_SHORT);if(a!==b)return toast('Passwords do not match');
 DKRAW=crypto.getRandomValues(new Uint8Array(32));DK=await dkKey(DKRAW);const rc=recCode();
 try{await rpc('pb_set_pass',{p_token:S.token,p_old:LPASS,p_new:a,p_wrap_pw:await enc(await kdf(a,'pw:'+S.code),DKRAW),p_wrap_rec:await enc(await kdf(rc,'rec:'+S.code),DKRAW)})}catch(e){if(e.message!=='stop')toast(e.message);return}
 S.must_change=false;saveSess();
 $('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">Write down your recovery code</h2><p>If you forget your password, you need this code to unlock Aadhaar, PAN and mobile again. Write it on paper and keep it safe. Do not share it.</p><div class="code">${rc}</div><div style="margin-top:12px"><button onclick="start()">I have written it, continue</button></div></div>`}
function resetView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">Your password was reset</h2>
 <p class="muted">Enter the recovery code you got the first time, then set a new password.</p>
 <label>Recovery code<input id="rc" placeholder="XXXX-XXXX-XXXX-XXXX"></label><label style="margin-top:8px">New password<input id="n1" type="password"></label><label style="margin-top:8px">Confirm password<input id="n2" type="password"></label>
 <div class="row" style="margin-top:10px"><button onclick="doReset(false)">Save</button><button class="o s" onclick="doReset(true)">I don't have the recovery code</button></div></div>`}
async function doReset(lost){const a=$('n1').value,b=$('n2').value;if(a.length<6)return toast(ERR.PASSWORD_TOO_SHORT);if(a!==b)return toast('Passwords do not match');
 let rc=null;
 if(lost){if(!confirm('Without the recovery code, Aadhaar, PAN and mobile of old customers will be cleared (other details stay). Continue?'))return;DKRAW=crypto.getRandomValues(new Uint8Array(32));rc=recCode()}
 else{try{DKRAW=await dec(await kdf($('rc').value.trim().toUpperCase(),'rec:'+S.code),S.wrap_rec)}catch(e){return toast('Wrong recovery code')}}
 DK=await dkKey(DKRAW);
 try{await rpc('pb_set_pass',{p_token:S.token,p_old:LPASS,p_new:a,p_wrap_pw:await enc(await kdf(a,'pw:'+S.code),DKRAW),p_wrap_rec:rc?await enc(await kdf(rc,'rec:'+S.code),DKRAW):null})}catch(e){if(e.message!=='stop')toast(e.message);return}
 S.must_change=false;saveSess();
 if(rc){$('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">New recovery code</h2><div class="code">${rc}</div><div style="margin-top:12px"><button onclick="start()">I have written it</button></div></div>`}else start()}
async function payView(kind){hdr();let st=null;try{const r=await SB.rpc('pb_status',{p_token:S.token});st=r.data}catch(e){}
 const p=(st&&st.pay)||{};const amt=st&&st.price?st.price:0;
 const upi=p.upi?`upi://pay?pa=${encodeURIComponent(p.upi)}&pn=${encodeURIComponent(p.payee||'UltraAccounting')}${amt?'&am='+amt:''}&cu=INR&tn=${encodeURIComponent('Passbook '+S.code)}`:'';
 $('app').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto;text-align:center"><h2 style="margin-top:0">${kind==='BLOCKED'?'Software blocked':'Your plan has expired'}</h2>
 ${kind==='EXPIRED'?`<p>Please pay ${amt?'<b>₹'+amt+'</b> ':''}to continue.</p>${upi?`<img alt="UPI QR" style="width:220px;height:220px" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upi)}"><p><b>${esc(p.upi)}</b><br>${esc(p.payee||'')}</p>`:''}`:''}
 ${p.msg?`<p>${esc(p.msg)}</p>`:''}<p class="muted">After payment, inform ${p.phone?'<b>'+esc(p.phone)+'</b>':'the owner'}. It will start again once confirmed.</p>
 <div class="row" style="justify-content:center"><button onclick="recheck()">Check again</button><button class="o" onclick="logout()">Logout</button></div></div>`}
async function recheck(){try{const r=await SB.rpc('pb_status',{p_token:S.token});if(r.error)throw r.error;const st=r.data;S.valid_until=st.valid_until;saveSess();
 const ok=st.active&&(!st.valid_until||st.valid_until>=new Date(Date.now()+19800000).toISOString().slice(0,10));if(ok){toast('Activated');start()}else toast('Not confirmed yet')}catch(e){logout(true)}}
// ---------- customers ----------
const F=[['cust_id','Customer ID'],['name','Acc. holder'],['acc_no','Account no.'],['joint','Joint holder'],['co','Address 1 (C/O)'],['addr2','Address 2'],['addr3','Address 3'],['addr4','State / PIN'],['opened','Opened on (DD-MM-YYYY)'],['operated','Operated by'],['nominee','Nominee']];
const FE=[['uid','UID / Aadhaar no.'],['pan','PAN number'],['mobile','Mobile no.']];
async function start(){hdr();await loadC();listView()}
async function loadC(){try{const rows=await rpc('pb_list',{p_token:S.token});CUST=await Promise.all(rows.map(async r=>{let e={};if(r.enc){try{e=JSON.parse(td.decode(await dec(DK,r.enc)))}catch(x){e={_locked:1}}}return {id:r.id,...r.data,...e,updated_at:r.updated_at}}))}catch(e){if(e.message!=='stop')toast(e.message);throw e}}
function listView(q){hdr();q=q||'';const ql=q.toLowerCase();const L=CUST.filter(c=>!ql||[c.name,c.acc_no,c.cust_id,c.mobile,c.co].join(' ').toLowerCase().includes(ql));
 $('app').innerHTML=`<div class="card"><div class="row"><input id="q" placeholder="Search by name, account no., customer ID" style="flex:1;min-width:220px" value="${esc(q)}"><button onclick="edit()">+ New customer</button></div>
 <p class="muted">${CUST.length} customers saved</p><table><tr><th>Customer ID</th><th>Name</th><th>Account no.</th><th>Opened</th><th></th></tr>
 ${L.slice(0,300).map(c=>`<tr class="c" onclick="edit('${c.id}')"><td>${esc(c.cust_id)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.acc_no)}</td><td>${esc(c.opened)}</td><td><button class="s" onclick="event.stopPropagation();edit('${c.id}',1)">Print</button></td></tr>`).join('')||'<tr><td colspan=5 class="muted">No customers yet. Click "+ New customer" or import from Excel.</td></tr>'}</table></div>`;
 const qi=$('q');qi.oninput=()=>{const v=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{listView(v);const n=$('q');n.focus();n.setSelectionRange(v.length,v.length)},250)}}
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()}
function edit(id,prt){CUR=id?{...CUST.find(c=>c.id===id)}:{operated:'SELF'};CUR.issue=today();hdr();
 $('app').innerHTML=`<div class="split"><div class="card"><h3 style="margin-top:0">${id?'Customer':'New customer'}</h3>
<div class="muted">Bank account opening PDF → fills the form.</div>
 ${F.map(([k,l])=>`<label style="margin-top:6px">${l}<input data-k="${k}" value="${esc(CUR[k])}"></label>`).join('')}
 ${FE.map(([k,l])=>`<label style="margin-top:6px">${l} 🔒<input data-k="${k}" value="${esc(CUR[k])}"></label>`).join('')}
 <label style="margin-top:6px">Issue date<input data-k="issue" value="${esc(CUR.issue)}"></label>
 <label class="o" style="display:inline-block;margin:4px 0 8px;padding:8px 12px;border:1px solid #6a1b9a;border-radius:6px;color:#6a1b9a;cursor:pointer;font-weight:600">📄 Import PDF<input type="file" accept="application/pdf,.pdf" onchange="impPdf(event)" style="display:none"></label>
 <div class="row" style="margin-top:10px"><button onclick="saveCur()">Save</button><button onclick="saveCur(1)">Save + Print</button><button class="o" onclick="listView()">Back</button>${id?`<button class="r s" onclick="delCur()">Delete</button>`:''}</div>
 <p class="muted">🔒 fields are locked with your password before saving to the cloud.</p></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Print preview</h3><button onclick="doPrint()">🖨 Print</button></div><p class="muted">Preview is at passbook page size. To shift the position, use Settings.</p><div id="pv"></div></div></div>`;
 document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{CUR[i.dataset.k]=i.value;prev()});prev();if(prt)setTimeout(doPrint,300)}
function grab(){document.querySelectorAll('[data-k]').forEach(i=>CUR[i.dataset.k]=i.value.trim())}
async function saveCur(prt){grab();if(!CUR.name&&!CUR.acc_no)return toast('Enter name or account no.');
 const data={};F.forEach(([k])=>data[k]=CUR[k]||'');const e={};FE.forEach(([k])=>e[k]=CUR[k]||'');
 const id=CUR.id||crypto.randomUUID();
 try{await rpc('pb_save',{p_token:S.token,p_rows:[{id,data,enc:await enc(DK,te.encode(JSON.stringify(e)))}]})}catch(x){if(x.message!=='stop')toast(x.message);return}
 CUR.id=id;const i=CUST.findIndex(c=>c.id===id);const rec={id,...data,...e};if(i>=0)CUST[i]=rec;else CUST.unshift(rec);toast('Saved');if(prt)doPrint()}
async function delCur(){if(!confirm('Delete this customer?'))return;try{await rpc('pb_delete',{p_token:S.token,p_id:CUR.id})}catch(x){if(x.message!=='stop')toast(x.message);return}CUST=CUST.filter(c=>c.id!==CUR.id);toast('Deleted');listView()}
function pdfParse(T){const ls=T.split('\n').map(s=>s.replace(/\s+$/,''));const U=s=>String(s||'').replace(/\s+/g,' ').trim().toUpperCase();
 const val=(re)=>{for(const l of ls){const m=l.match(re);if(m)return m[1].trim()}return ''};
 const o={};o.name=U(val(/^\s*Customer Name\s{2,}(.+)/i));o.acc_no=val(/^\s*Account No\s{2,}(\d{6,})/i);o.cust_id=U(val(/^\s*Customer ID\s{2,}(\S+)/i));
 o.uid=U(val(/^\s*Aadhaar No\s{2,}([X\d ]{8,})/i)).replace(/\s/g,'');o.mobile=val(/^\s*Mobile No\s{2,}(\d{10})/i)||val(/^\s*Tel\.No.*?\s{2,}(\d{10})/i);
 const sex=U(val(/^\s*Sex\s{2,}(\S+)/i));const gu=U(val(/Name of Father \/ Guardian\s{2,}(.+)/i));const sp=U(val(/Name of Spouse.*?\)\s{2,}(.+)/i));const ms=U(val(/Marital Status\s{2,}(\S+)/i));
 if(sex==='FEMALE'&&ms==='MARRIED'&&sp)o.co='W/O '+sp;else if(gu)o.co=(sex==='FEMALE'?'D/O ':'S/O ')+gu;
 const pan=U(val(/PAN \/ GIR no.*?\s{2,}([A-Z]{5}\d{4}[A-Z])/i));if(pan)o.pan=pan;
 const a0=ls.findIndex(l=>/ADDRESS\s*:/i.test(l));let ad='';if(a0>=0){const blk=[];for(let j=a0;j<ls.length&&j<a0+10;j++){if(j>a0&&/Tel\.No|^\s*Email|CUSTOMER PROFILE/i.test(ls[j]))break;blk.push(ls[j])}
  ad=blk.join(' ').replace(/.*ADDRESS\s*:/i,'').replace(/Flat No\.\/Bldg\. Name|Street \/ Road \/ Locality|City \/ District \/ State with pincode/gi,' ')}
 ad=ad.replace(/C\/O\s*:?[^,]*,?/i,'');const pin=(ad.match(/\b(\d{6})\b/)||[])[1]||'';ad=ad.replace(/\b\d{6}\b/,'');
 const parts=ad.split(',').map(s=>s.replace(/\s*-\s*/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);let vill='',po='',dist='',st='',rest=[];
 parts.forEach(p=>{let m;if(m=p.match(/^(?:Village|Vill\.?)\s+(.+)/i))vill=m[1];else if(m=p.match(/^(?:Post|PO|P\.O\.?)\s+(.+)/i))po=m[1];else if(m=p.match(/^(?:Dist|District)\.?\s+(.+)/i))dist=m[1];else if(/bengal|bihar|jharkhand|assam|odisha|pradesh/i.test(p))st=p;else rest.push(p)});
 o.addr2=U([vill&&'VILL '+vill,po&&'PO '+po].filter(Boolean).join(', '));o.addr3=U([rest.join(', '),dist&&'DIST '+dist].filter(Boolean).join(', '));o.addr4=U([st,pin].filter(Boolean).join(' - '));
 if(!o.addr2){o.addr2=o.addr3;o.addr3=''}
 const ft=T.match(/\d+ of \d+\s+(\d{2}-\d{2}-\d{4})/);if(ft)o.opened=ft[1];
 const i=ls.findIndex(l=>/minority of nominee/i.test(l));if(i>=0){const R=/^(FATHER|MOTHER|HUSBAND|WIFE|SON|DAUGHTER|BROTHER|SISTER|GRANDFATHER|GRANDMOTHER|UNCLE|AUNT|OTHERS?|GUARDIAN|SPOUSE)$/i;let nm=[],rel='';
  for(let j=i+1;j<ls.length&&j<i+12;j++){const l=ls[j].trim();if(!l)continue;if(/^(Date|Place)\s*:/i.test(l)||/WITNESS/i.test(l))break;l.split(/\s{2,}/).forEach(t=>{if(R.test(t))rel=t;else if(/^[A-Za-z .]+$/.test(t))nm.push(t)})}
  if(nm.length)o.nominee=U(nm.join(' '))+(rel?' ('+U(rel)+')':'')}
 o.operated=U(val(/Mode of Operation\s*:\s*(\S+)/i))||'SELF';
 Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o}

let PJ=null;async function pdfjs(){if(PJ)return PJ;const V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await new Promise((ok,no)=>{const s=document.createElement('script');s.src=V+'pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js';return PJ=window.pdfjsLib}
async function pdfText(buf){const P=await pdfjs();const doc=await P.getDocument({data:buf}).promise;let out=[];
 for(let n=1;n<=doc.numPages;n++){const tc=await (await doc.getPage(n)).getTextContent();const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width}));it.sort((a,b)=>b.y-a.y||a.x-b.x);
  const L=[];it.forEach(i=>{let l=L.find(l=>Math.abs(l.y-i.y)<3);if(!l)L.push(l={y:i.y,a:[]});l.a.push(i)});L.sort((a,b)=>b.y-a.y);
  L.forEach(l=>{l.a.sort((a,b)=>a.x-b.x);let t='',e=null;l.a.forEach(i=>{if(e!==null){const g=i.x-e;t+=g>8?'   ':(g>1||!/\s$/.test(t))&&!/^\s/.test(i.s)?' ':''}t+=i.s;e=i.x+i.w});out.push('          '+t)})}
 return out.join('\n')}
async function impPdf(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;try{toast('Reading PDF…');const o=pdfParse(await pdfText(await f.arrayBuffer()));if(!o.name&&!o.acc_no)return toast('Could not read this PDF. Use the bank account opening receipt PDF.');
 grab();if(o.acc_no){const ex=CUST.find(c=>c.acc_no===o.acc_no);if(ex&&ex.id!==CUR.id&&!confirm('This account no. is already saved ('+ex.name+'). Open and update it?'))return;if(ex&&ex.id!==CUR.id)CUR={...ex}}
 Object.assign(CUR,o);CUR.issue=CUR.issue||today();document.querySelectorAll('[data-k]').forEach(i=>i.value=CUR[i.dataset.k]||'');prev();toast('PDF imported. Check the fields, then Save.')}catch(x){toast('PDF error: '+x.message)}}
// ---------- layout ----------
function lines(c,st){const L=[],R=[];const lab=(a,v)=>a+(v||'');
 L.push(lab('BRANCH NAME: ',st.branch));R.push(lab('IFSC CODE: ',st.ifsc));
 L.push(lab('BR. ADDRESS: ',st.baddr1));R.push('');
 const ba=[st.baddr2,st.baddr3].filter(Boolean);ba.forEach(b=>{L.push('             '+b);R.push('')});
 R[R.length-1]=lab('MICR CODE: ',st.micr);
 L.push(lab('BR. EMAIL  : ',st.bemail));R.push('');
 const ad=[c.co,c.addr2,c.addr3,c.addr4].filter(Boolean);
 const left=[['CUSTOMER ID: ',c.cust_id],['ACCOUNT NO.: ',c.acc_no],['UID NO.    : ',fmtUid(c.uid)],['PAN NUMBER : ',c.pan],['MOBILE NO. : ',c.mobile],['OPENED ON  : ',c.opened],['ISSUE DATE : ',c.issue],['OPERATED BY: ',c.operated],['NOMINEE    : ',c.nominee]];
 const right=[lab('ACC. HOLDER : ',c.name),lab('JOINT HOLDER: ',c.joint)];ad.forEach((a,i)=>right.push((i?'            ':'CUST ADD.   ')+a));
 const n=Math.max(left.length,right.length);for(let i=0;i<n;i++){L.push(left[i]?lab(left[i][0],left[i][1]):'');R.push(right[i]||'')}
 const g=+st.colgap||48;return L.map((l,i)=>(R[i]?l.padEnd(g,' ')+R[i]:l).toUpperCase()).join('\n')}
function fmtUid(u){u=String(u||'').replace(/\s/g,'').toUpperCase();if(/^X+\d{4}$/.test(u))return 'XXXX XXXX '+u.slice(-4);return u.length===12?u.replace(/(\d{4})(\d{4})(\d{4})/,'$1 $2 $3'):u}
function cssVars(el,st){el.style.setProperty('--ff',st.ff);el.style.setProperty('--fs',st.fs+'pt');el.style.setProperty('--fw',st.bold?'700':'400');el.style.setProperty('--top',st.top+'mm');el.style.setProperty('--left',st.left+'mm')}
function prev(c){c=c||CUR;const st=SETK();const pv=$('pv');if(!pv)return;pv.style.width=st.pw+'mm';pv.style.height=st.ph+'mm';pv.innerHTML=`<div class="sheet"></div>`;const sh=pv.firstChild;cssVars(sh,st);sh.textContent=lines(c,st)}
function doPrint(c){c=c||CUR;grab&&document.querySelector('[data-k]')&&grab();const st=SETK();
 $('pageCss').textContent=`@media print{@page{size:${st.pw}mm ${st.ph}mm;margin:0}}`;

// ---------- settings ----------
function setView(){hdr();const st=SETK();const fonts=[["'Courier New',monospace",'Courier New'],["Consolas,monospace",'Consolas'],["'Lucida Console',monospace",'Lucida Console'],["Arial,sans-serif",'Arial'],["'Times New Roman',serif",'Times New Roman']];
 CUR=CUR||{name:'NUREFA SAMPLE',acc_no:'5124XXXXXXXX',cust_id:'F600XXXXX',uid:'XXXXXXXXXXXX',co:'C/O: SAMPLE',addr2:'VILLAGE',addr3:'MALDA',addr4:'WEST BENGAL,INDIA PIN-732140',opened:'17-09-2019',issue:today(),operated:'SELF'};
 const n=(k,l,s)=>`<label>${l}<input type="number" step="${s||1}" data-s="${k}" value="${esc(st[k])}"></label>`,t=(k,l)=>`<label>${l}<input data-s="${k}" value="${esc(st[k])}"></label>`;
 $('app').innerHTML=`<div class="split"><div class="card"><h3 style="margin-top:0">Branch (printed on every page)</h3>${t('branch','Branch name')}${t('ifsc','IFSC code')}${t('baddr1','Br. address 1')}${t('baddr2','Br. address 2')}${t('baddr3','Br. address 3 / PIN')}${t('micr','MICR code')}${t('bemail','Br. email')}
 <h3>Print settings</h3><label>Font<select data-s="ff">${fonts.map(f=>`<option value="${esc(f[0])}" ${f[0]===st.ff?'selected':''}>${f[1]}</option>`).join('')}</select></label>

 <div class="g2">${n('fs','Font size (pt)',0.5)}${n('colgap','Right column starts at (characters)')}${n('top','From top (mm)',0.5)}${n('left','From left (mm)',0.5)}${n('pw','Page width (mm)')}${n('ph','Page height (mm)')}</div>

 try{await rpc('pb_settings',{p_token:S.token,p_settings:o})}catch(x){if(x.message!=='stop')toast(x.message);return}S.settings=o;saveSess();toast('Settings saved');setView()}

let XL=null;async function xlsx(){if(XL)return XL;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return XL=window.XLSX}

 <div class="row"><button onclick="exp()">⬇ All customers to Excel (backup)</button><button class="o" onclick="tpl()">Blank Excel format</button></div>

async function exp(){const X=await xlsx();const rows=CUST.map(c=>Object.fromEntries(ALL.map(([k,l])=>[l,c[k]||''])));const ws=X.utils.json_to_sheet(rows,{header:ALL.map(a=>a[1])});const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Customers');X.writeFile(wb,`passbook-${S.code}-${today()}.xlsx`)}

const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function imp(ev){const f=ev.target.files[0];if(!f)return;const X=await xlsx();const wb=X.read(await f.arrayBuffer());const js=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
 const map={};const alias={cust_id:['customerid','custid','cif'],name:['accholder','name','accountholder','customername'],acc_no:['accountno','accno','accountnumber'],joint:['jointholder'],co:['address1co','address1','co','address'],addr2:['address2'],addr3:['address3'],addr4:['statepin','pin','address4'],opened:['openedonddmmyyyy','openedon','opened','openingdate'],operated:['operatedby'],nominee:['nominee'],uid:['uidaadhaarno','uid','aadhaar','aadhar','uidno'],pan:['pannumber','pan'],mobile:['mobileno','mobile','phone']};
 const heads=Object.keys(js[0]||{});for(const[k,al]of Object.entries(alias)){const h=heads.find(h=>al.includes(norm(h)));if(h)map[k]=h}
 if(!map.name&&!map.acc_no)return $('ir').innerHTML='<p style="color:#b42318">Column names not recognised. Download "Blank Excel format" and fill your data in it.</p>';
 const byAcc=Object.fromEntries(CUST.filter(c=>c.acc_no).map(c=>[c.acc_no,c.id]));const out=[];
 for(const r of js){const c={};for(const k in map)c[k]=String(r[map[k]]).trim();if(!c.name&&!c.acc_no)continue;if(!c.operated)c.operated='SELF';
  const data={};F.forEach(([k])=>data[k]=c[k]||'');const e={};FE.forEach(([k])=>e[k]=c[k]||'');out.push({id:byAcc[c.acc_no]||crypto.randomUUID(),data,enc:await enc(DK,te.encode(JSON.stringify(e)))})}
 if(!out.length)return toast('No rows found');if(!confirm(out.length+' customers will be imported. Continue?'))return;
 try{for(let i=0;i<out.length;i+=200){$('ir').textContent='Importing… '+Math.min(i+200,out.length)+'/'+out.length;await rpc('pb_save',{p_token:S.token,p_rows:out.slice(i,i+200)})}}catch(x){if(x.message!=='stop')toast(x.message);return}
 await loadC();$('ir').innerHTML='<p style="color:#0f7a4a">'+out.length+' customers imported.</p>'}
