<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>UltraAccounting Passbook</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4b1fa8"><link rel="icon" href="icon-192.png">
<style>
:root{--p:#5b21b6;--pd:#4b1fa8;--bg:#f4f1fb;--t:#1f1535;--m:#6b6480;--b:#ddd5f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--pd);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)}
main{max-width:1150px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(40,10,90,.07);padding:14px;margin-bottom:14px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;width:100%}
label{font-size:13px;color:var(--m);display:block}
button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer}
button.o{background:#fff;color:var(--p);border:1px solid var(--p)}button.r{background:#c0392b}button.s{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}th{background:#f6f3fd}
tr.c:hover{background:#faf8ff;cursor:pointer}.muted{color:var(--m);font-size:13px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:#e8f7ee;color:#0f7a4a}.chip.w{background:#fff3cd;color:#8a6100}.chip.x{background:#fde2e1;color:#b42318}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f1535;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.split{display:grid;grid-template-columns:330px 1fr;gap:14px}@media(max-width:900px){.split{grid-template-columns:1fr}}
#pv{border:2px dashed #b9a8e8;background:#fff;overflow:auto;position:relative}
.sheet{font-family:var(--ff);font-size:var(--fs);font-weight:var(--fw);line-height:1.25;white-space:pre;color:#000;padding:var(--top) 0 0 var(--left)}
.code{font-family:Consolas,monospace;font-size:20px;letter-spacing:2px;background:#f6f3fd;padding:10px;border-radius:8px;text-align:center}
#printArea{display:none}
@media print{@page{size:var(--pw) var(--ph);margin:0}body{background:#fff}header,main,#msg{display:none!important}#printArea{display:block}}
</style><style id="pageCss"></style></head><body>
<header><h1 id="ttl">UltraAccounting · Passbook</h1><span id="days"></span><span id="hb"></span></header>
<main id="app"><div class="card">Loading…</div></main><div id="printArea"></div><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://ochdzpcxrhlzloxbnzua.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jaGR6cGN4cmhsemxveGJuenVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODMyNDgsImV4cCI6MjEwOTA1OTI0OH0.ydBBoTuNF1qsQMYN0LMS4GZbie98iZ60Bj0et0-jWcw',{auth:{persistSession:false}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',3500)}
const ERR={WRONG_LOGIN:'Shop ID ya password galat hai',BLOCKED:'Yeh dukaan band hai. UltraAccounting se baat karein.',EXPIRED:'Plan khatam ho gaya',LOGIN_EXPIRED:'Dobara login karein',WRONG_OLD_PASSWORD:'Purana password galat',PASSWORD_TOO_SHORT:'Password kam se kam 6 akshar'};
async function rpc(fn,args){const {data,error}=await SB.rpc(fn,args);if(error){const k=(error.message||'').trim();if(k==='EXPIRED'||k==='BLOCKED'){await payView(k);throw new Error('stop')}if(k==='LOGIN_EXPIRED'){logout(true);throw new Error('stop')}throw new Error(ERR[k]||k)}return data}
// ---------- crypto ----------
const te=new TextEncoder(),td=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);const o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return b64(o)}
async function dec(key,s){const a=ub64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12)))}
async function dkKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
function recCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(16));let s='';r.forEach((v,i)=>{s+=A[v%A.length];if(i%4==3&&i<15)s+='-'});return s}
// ---------- state ----------
let S=null,DK=null,DKRAW=null,CUST=[],CUR=null;
const DEF={branch:'',ifsc:'',baddr1:'',baddr2:'',baddr3:'',micr:'',bemail:'',pw:150,ph:210,ff:"'Courier New',monospace",fs:10,bold:true,top:12,left:6,colgap:48};
const SETK=()=>Object.assign({},DEF,S.settings||{});
const store=()=>localStorage.getItem('pb_keep')==='1'?localStorage:sessionStorage;
function saveSess(){store().setItem('pb_sess',JSON.stringify({S,dk:b64(DKRAW)}))}
async function restore(){const j=localStorage.getItem('pb_sess')||sessionStorage.getItem('pb_sess');if(!j)return false;try{const o=JSON.parse(j);S=o.S;DKRAW=ub64(o.dk);DK=await dkKey(DKRAW);return true}catch(e){return false}}
function logout(silent){if(S&&!silent)SB.rpc('pb_logout',{p_token:S.token});localStorage.removeItem('pb_sess');sessionStorage.removeItem('pb_sess');S=null;DK=null;loginView();if(silent)toast('Dobara login karein')}
// ---------- views ----------
function hdr(){if(!S){$('ttl').textContent='UltraAccounting · Passbook';$('days').innerHTML='';$('hb').innerHTML='';return}
 $('ttl').textContent=S.name+' · Passbook';let d='';if(S.valid_until){const n=Math.round((new Date(S.valid_until+'T23:59:59')-new Date())/864e5);d=`<span class="chip ${n<0?'x':n<=7?'w':''}">${n<0?'Plan khatam':n+' din baki'}</span>`}$('days').innerHTML=d;
 $('hb').innerHTML=`<button class="s" onclick="listView()">Customers</button> <button class="s" onclick="setView()">Settings</button> <button class="s" onclick="bkView()">Excel / Backup</button> <button class="s" onclick="logout()">Logout</button>`}
function loginView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:400px;margin:40px auto"><h2 style="margin-top:0">Dukaan login</h2>
 <label>Shop ID<input id="lc" autocomplete="username"></label><label style="margin-top:8px">Password<input id="lp" type="password" autocomplete="current-password"></label>
 <label style="margin-top:8px;display:flex;gap:6px;align-items:center;color:#333"><input type="checkbox" id="lk" style="width:auto" checked> Is computer par login yaad rakho</label>
 <div style="margin-top:10px"><button onclick="doLogin()">Login</button></div><p class="muted">Shop ID aur password UltraAccounting (SK Nuruddin) se milega.</p></div>`;
 $('lp').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
let LPASS='';
async function doLogin(){const c=$('lc').value.trim().toLowerCase(),p=$('lp').value;if(!c||!p)return;localStorage.setItem('pb_keep',$('lk').checked?'1':'0');
 try{S=await rpc('pb_login',{p_code:c,p_pass:p})}catch(e){if(e.message!=='stop')toast(e.message);return}LPASS=p;
 if(S.must_change&&!S.wrap_pw)return firstView();
 if(S.must_change)return resetView();
 try{DKRAW=await dec(await kdf(p,'pw:'+S.code),S.wrap_pw);DK=await dkKey(DKRAW)}catch(e){toast('Data chabi nahi khuli');return}
 saveSess();start()}
function firstView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2 style="margin-top:0">Pehli baar: apna password rakhein</h2>
 <label>Naya password (kam se kam 6)<input id="n1" type="password"></label><label style="margin-top:8px">Dobara likhein<input id="n2" type="password"></label>
 <div style="margin-top:10px"><button onclick="doFirst()">Save</button></div></div>`}
async function doFirst(){const a=$('n1').value,b=$('n2').value;if(a.length<6)return toast(ERR.PASSWORD_TOO_SHORT);if(a!==b)return toast('Dono password alag hain');
 DKRAW=crypto.getRandomValues(new Uint8Array(32));DK=await dkKey(DKRAW);const rc=recCode();
 try{await rpc('pb_set_pass',{p_token:S.token,p_old:LPASS,p_new:a,p_wrap_pw:await enc(await kdf(a,'pw:'+S.code),DKRAW),p_wrap_rec:await enc(await kdf(rc,'rec:'+S.code),DKRAW)})}catch(e){if(e.message!=='stop')toast(e.message);return}
 S.must_change=false;saveSess();
 $('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">Recovery code likh lein</h2><p>Password bhool gaye toh Aadhaar, PAN, mobile wapas kholne ke liye yeh code chahiye. Ise kaagaz par likh kar rakhein, kisi ko na dein.</p><div class="code">${rc}</div><div style="margin-top:12px"><button onclick="start()">Likh liya, aage chalo</button></div></div>`}
function resetView(){hdr();$('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">Password reset hua hai</h2>
 <p class="muted">Recovery code daalein (jo pehli baar mila tha), aur naya password rakhein.</p>
 <label>Recovery code<input id="rc" placeholder="XXXX-XXXX-XXXX-XXXX"></label><label style="margin-top:8px">Naya password<input id="n1" type="password"></label><label style="margin-top:8px">Dobara likhein<input id="n2" type="password"></label>
 <div class="row" style="margin-top:10px"><button onclick="doReset(false)">Save</button><button class="o s" onclick="doReset(true)">Recovery code nahi hai</button></div></div>`}
async function doReset(lost){const a=$('n1').value,b=$('n2').value;if(a.length<6)return toast(ERR.PASSWORD_TOO_SHORT);if(a!==b)return toast('Dono password alag hain');
 let rc=null;
 if(lost){if(!confirm('Bina recovery code ke purane customers ka Aadhaar, PAN, mobile khaali ho jayega (baaki details rahengi). Aage badhein?'))return;DKRAW=crypto.getRandomValues(new Uint8Array(32));rc=recCode()}
 else{try{DKRAW=await dec(await kdf($('rc').value.trim().toUpperCase(),'rec:'+S.code),S.wrap_rec)}catch(e){return toast('Recovery code galat hai')}}
 DK=await dkKey(DKRAW);
 try{await rpc('pb_set_pass',{p_token:S.token,p_old:LPASS,p_new:a,p_wrap_pw:await enc(await kdf(a,'pw:'+S.code),DKRAW),p_wrap_rec:rc?await enc(await kdf(rc,'rec:'+S.code),DKRAW):null})}catch(e){if(e.message!=='stop')toast(e.message);return}
 S.must_change=false;saveSess();
 if(rc){$('app').innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2 style="margin-top:0">Naya recovery code</h2><div class="code">${rc}</div><div style="margin-top:12px"><button onclick="start()">Likh liya</button></div></div>`}else start()}
async function payView(kind){hdr();let st=null;try{const r=await SB.rpc('pb_status',{p_token:S.token});st=r.data}catch(e){}
 const p=(st&&st.pay)||{};const amt=st&&st.price?st.price:0;
 const upi=p.upi?`upi://pay?pa=${encodeURIComponent(p.upi)}&pn=${encodeURIComponent(p.payee||'UltraAccounting')}${amt?'&am='+amt:''}&cu=INR&tn=${encodeURIComponent('Passbook '+S.code)}`:'';
 $('app').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto;text-align:center"><h2 style="margin-top:0">${kind==='BLOCKED'?'Software band hai':'Plan khatam ho gaya'}</h2>
 ${kind==='EXPIRED'?`<p>Aage chalane ke liye ${amt?'<b>₹'+amt+'</b> ':''}payment karein.</p>${upi?`<img alt="UPI QR" style="width:220px;height:220px" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upi)}"><p><b>${esc(p.upi)}</b><br>${esc(p.payee||'')}</p>`:''}`:''}
 ${p.msg?`<p>${esc(p.msg)}</p>`:''}<p class="muted">Payment ke baad ${p.phone?'<b>'+esc(p.phone)+'</b> par ':''}batayein. Confirm hote hi chalu ho jayega.</p>
 <div class="row" style="justify-content:center"><button onclick="recheck()">Dobara check karo</button><button class="o" onclick="logout()">Logout</button></div></div>`}
async function recheck(){try{const r=await SB.rpc('pb_status',{p_token:S.token});if(r.error)throw r.error;const st=r.data;S.valid_until=st.valid_until;saveSess();
 const ok=st.active&&(!st.valid_until||st.valid_until>=new Date(Date.now()+19800000).toISOString().slice(0,10));if(ok){toast('Chalu ho gaya');start()}else toast('Abhi confirm nahi hua')}catch(e){logout(true)}}
// ---------- customers ----------
const F=[['cust_id','Customer ID'],['name','Acc. holder'],['acc_no','Account no.'],['joint','Joint holder'],['co','Address 1 (C/O)'],['addr2','Address 2'],['addr3','Address 3'],['addr4','State / PIN'],['opened','Opened on (DD-MM-YYYY)'],['operated','Operated by'],['nominee','Nominee']];
const FE=[['uid','UID / Aadhaar no.'],['pan','PAN number'],['mobile','Mobile no.']];
async function start(){hdr();await loadC();listView()}
async function loadC(){try{const rows=await rpc('pb_list',{p_token:S.token});CUST=await Promise.all(rows.map(async r=>{let e={};if(r.enc){try{e=JSON.parse(td.decode(await dec(DK,r.enc)))}catch(x){e={_locked:1}}}return {id:r.id,...r.data,...e,updated_at:r.updated_at}}))}catch(e){if(e.message!=='stop')toast(e.message);throw e}}
function listView(q){hdr();q=q||'';const ql=q.toLowerCase();const L=CUST.filter(c=>!ql||[c.name,c.acc_no,c.cust_id,c.mobile,c.co].join(' ').toLowerCase().includes(ql));
 $('app').innerHTML=`<div class="card"><div class="row"><input id="q" placeholder="Naam, account no., customer ID se khojein" style="flex:1;min-width:220px" value="${esc(q)}"><button onclick="edit()">+ Naya customer</button></div>
 <p class="muted">${CUST.length} customer saved</p><table><tr><th>Customer ID</th><th>Naam</th><th>Account no.</th><th>Opened</th><th></th></tr>
 ${L.slice(0,300).map(c=>`<tr class="c" onclick="edit('${c.id}')"><td>${esc(c.cust_id)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.acc_no)}</td><td>${esc(c.opened)}</td><td><button class="s" onclick="event.stopPropagation();edit('${c.id}',1)">Print</button></td></tr>`).join('')||'<tr><td colspan=5 class="muted">Koi customer nahi. "+ Naya customer" dabayein ya Excel se import karein.</td></tr>'}</table></div>`;
 const qi=$('q');qi.oninput=()=>{const v=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{listView(v);const n=$('q');n.focus();n.setSelectionRange(v.length,v.length)},250)}}
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()}
function edit(id,prt){CUR=id?{...CUST.find(c=>c.id===id)}:{operated:'SELF'};CUR.issue=today();hdr();
 $('app').innerHTML=`<div class="split"><div class="card"><h3 style="margin-top:0">${id?'Customer':'Naya customer'}</h3>
 ${F.map(([k,l])=>`<label style="margin-top:6px">${l}<input data-k="${k}" value="${esc(CUR[k])}"></label>`).join('')}
 ${FE.map(([k,l])=>`<label style="margin-top:6px">${l} 🔒<input data-k="${k}" value="${esc(CUR[k])}"></label>`).join('')}
 <label style="margin-top:6px">Issue date<input data-k="issue" value="${esc(CUR.issue)}"></label>
 <div class="row" style="margin-top:10px"><button onclick="saveCur()">Save</button><button onclick="saveCur(1)">Save + Print</button><button class="o" onclick="listView()">Back</button>${id?`<button class="r s" onclick="delCur()">Delete</button>`:''}</div>
 <p class="muted">🔒 wale khane aapke password se lock hokar cloud mein jaate hain.</p></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Print preview</h3><button onclick="doPrint()">🖨 Print</button></div><p class="muted">Preview passbook page ke size mein hai. Jagah aage-peeche karni ho toh Settings mein.</p><div id="pv"></div></div></div>`;
 document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{CUR[i.dataset.k]=i.value;prev()});prev();if(prt)setTimeout(doPrint,300)}
function grab(){document.querySelectorAll('[data-k]').forEach(i=>CUR[i.dataset.k]=i.value.trim())}
async function saveCur(prt){grab();if(!CUR.name&&!CUR.acc_no)return toast('Naam ya account no. daalein');
 const data={};F.forEach(([k])=>data[k]=CUR[k]||'');const e={};FE.forEach(([k])=>e[k]=CUR[k]||'');
 const id=CUR.id||crypto.randomUUID();
 try{await rpc('pb_save',{p_token:S.token,p_rows:[{id,data,enc:await enc(DK,te.encode(JSON.stringify(e)))}]})}catch(x){if(x.message!=='stop')toast(x.message);return}
 CUR.id=id;const i=CUST.findIndex(c=>c.id===id);const rec={id,...data,...e};if(i>=0)CUST[i]=rec;else CUST.unshift(rec);toast('Save ho gaya');if(prt)doPrint()}
async function delCur(){if(!confirm('Is customer ko delete karein?'))return;try{await rpc('pb_delete',{p_token:S.token,p_id:CUR.id})}catch(x){if(x.message!=='stop')toast(x.message);return}CUST=CUST.filter(c=>c.id!==CUR.id);toast('Delete ho gaya');listView()}
// ---------- layout ----------
function lines(c,st){const L=[],R=[];const lab=(a,v)=>a+(v||'');
 L.push(lab('BRANCH NAME: ',st.branch));R.push(lab('IFSC CODE: ',st.ifsc));
 L.push(lab('BR. ADDRESS: ',st.baddr1));R.push('');
 const ba=[st.baddr2,st.baddr3].filter(Boolean);ba.forEach(b=>{L.push('             '+b);R.push('')});
 R[R.length-1]=lab('MICR CODE: ',st.micr);
 L.push(lab('BR. EMAIL  : ',st.bemail));R.push('');
 const ad=[c.co,c.addr2,c.addr3,c.addr4].filter(Boolean);
 const left=[['CUSTOMER ID: ',c.cust_id],['ACCOUNT NO.: ',c.acc_no],['UID NO.    : ',fmtUid(c.uid)],['PAN NUMBER : ',c.pan],['MOBILE NO. : ',c.mobile],['OPENED ON  : ',c.opened],['ISSUE DATE : ',c.issue],['OPERATED BY: ',c.operated],['NOMINEE    : ',c.nominee]];
 const right=[lab('ACC. HOLDER : ',c.name),lab('JOINT HOLDER: ',c.joint)];ad.forEach((a,i)=>right.push((i?'            ':'CUST ADD.   ')+a));
 const n=Math.max(left.length,right.length);for(let i=0;i<n;i++){L.push(left[i]?lab(left[i][0],left[i][1]):'');R.push(right[i]||'')}
 const g=+st.colgap||48;return L.map((l,i)=>(R[i]?l.padEnd(g,' ')+R[i]:l).toUpperCase()).join('\n')}
function fmtUid(u){u=String(u||'').replace(/\s/g,'');return u.length===12?u.replace(/(\d{4})(\d{4})(\d{4})/,'$1 $2 $3'):u}
function cssVars(el,st){el.style.setProperty('--ff',st.ff);el.style.setProperty('--fs',st.fs+'pt');el.style.setProperty('--fw',st.bold?'700':'400');el.style.setProperty('--top',st.top+'mm');el.style.setProperty('--left',st.left+'mm')}
function prev(c){c=c||CUR;const st=SETK();const pv=$('pv');if(!pv)return;pv.style.width=st.pw+'mm';pv.style.height=st.ph+'mm';pv.innerHTML=`<div class="sheet"></div>`;const sh=pv.firstChild;cssVars(sh,st);sh.textContent=lines(c,st)}
function doPrint(c){c=c||CUR;grab&&document.querySelector('[data-k]')&&grab();const st=SETK();
 $('pageCss').textContent=`@media print{@page{size:${st.pw}mm ${st.ph}mm;margin:0}}`;
 const pa=$('printArea');pa.innerHTML='<div class="sheet"></div>';const sh=pa.firstChild;cssVars(sh,st);sh.textContent=lines(c,st);setTimeout(()=>window.print(),100)}
// ---------- settings ----------
function setView(){hdr();const st=SETK();const fonts=[["'Courier New',monospace",'Courier New'],["Consolas,monospace",'Consolas'],["'Lucida Console',monospace",'Lucida Console'],["Arial,sans-serif",'Arial'],["'Times New Roman',serif",'Times New Roman']];
 CUR=CUR||{name:'NUREFA SAMPLE',acc_no:'5124XXXXXXXX',cust_id:'F600XXXXX',uid:'XXXXXXXXXXXX',co:'C/O: SAMPLE',addr2:'VILLAGE',addr3:'MALDA',addr4:'WEST BENGAL,INDIA PIN-732140',opened:'17-09-2019',issue:today(),operated:'SELF'};
 const n=(k,l,s)=>`<label>${l}<input type="number" step="${s||1}" data-s="${k}" value="${esc(st[k])}"></label>`,t=(k,l)=>`<label>${l}<input data-s="${k}" value="${esc(st[k])}"></label>`;
 $('app').innerHTML=`<div class="split"><div class="card"><h3 style="margin-top:0">Branch (har page par)</h3>${t('branch','Branch name')}${t('ifsc','IFSC code')}${t('baddr1','Br. address 1')}${t('baddr2','Br. address 2')}${t('baddr3','Br. address 3 / PIN')}${t('micr','MICR code')}${t('bemail','Br. email')}
 <h3>Print setting</h3><label>Font<select data-s="ff">${fonts.map(f=>`<option value="${esc(f[0])}" ${f[0]===st.ff?'selected':''}>${f[1]}</option>`).join('')}</select></label>
 <label style="display:flex;gap:6px;align-items:center;margin-top:6px;color:#333"><input type="checkbox" data-s="bold" style="width:auto" ${st.bold?'checked':''}> Bold font</label>
 <div class="g2">${n('fs','Font size (pt)',0.5)}${n('colgap','Right column kahan se (akshar)')}${n('top','Upar se (mm)',0.5)}${n('left','Left se (mm)',0.5)}${n('pw','Page width (mm)')}${n('ph','Page height (mm)')}</div>
 <div class="row" style="margin-top:10px"><button onclick="saveSet()">Save</button><button class="o" onclick="saveSet(1)">Default</button><button class="o" onclick="doPrint()">Test print</button></div>
 <p class="muted">Printer: Print dabane par EPSON PLQ chunein, Chrome agli baar wahi yaad rakhega. "Margins: None" aur "Scale: 100" rakhein.</p></div>
 <div class="card"><h3 style="margin-top:0">Preview (sample)</h3><div id="pv"></div></div></div>`;
 document.querySelectorAll('[data-s]').forEach(i=>i.oninput=i.onchange=()=>{S.settings=readSet();prev()});prev()}
function readSet(){const o=Object.assign({},SETK());document.querySelectorAll('[data-s]').forEach(i=>{const k=i.dataset.s;o[k]=i.type==='checkbox'?i.checked:i.type==='number'?+i.value:i.value});return o}
async function saveSet(def){const o=def?Object.assign({},DEF,{branch:SETK().branch,ifsc:SETK().ifsc,baddr1:SETK().baddr1,baddr2:SETK().baddr2,baddr3:SETK().baddr3,micr:SETK().micr,bemail:SETK().bemail}):readSet();
 try{await rpc('pb_settings',{p_token:S.token,p_settings:o})}catch(x){if(x.message!=='stop')toast(x.message);return}S.settings=o;saveSess();toast('Settings save');setView()}
// ---------- excel ----------
let XL=null;async function xlsx(){if(XL)return XL;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return XL=window.XLSX}
const ALL=[...F,...FE];
function bkView(){hdr();$('app').innerHTML=`<div class="card"><h3 style="margin-top:0">Excel / Backup</h3>
 <div class="row"><button onclick="exp()">⬇ Sab customer Excel mein (backup)</button><button class="o" onclick="tpl()">Khali Excel format</button></div>
 <p class="muted">Backup file aapke computer ke Downloads mein aayegi. Pendrive ya Google Drive mein bhi rakh lein.</p>
 <h3>Excel se import</h3><input type="file" id="xf" accept=".xlsx,.xls,.csv"><p class="muted">Pehli line mein column naam: ${ALL.map(a=>a[1]).join(', ')}. Account no. pehle se ho toh update hoga, warna naya banega.</p><div id="ir"></div></div>`;
 $('xf').onchange=imp}
async function exp(){const X=await xlsx();const rows=CUST.map(c=>Object.fromEntries(ALL.map(([k,l])=>[l,c[k]||''])));const ws=X.utils.json_to_sheet(rows,{header:ALL.map(a=>a[1])});const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Customers');X.writeFile(wb,`passbook-${S.code}-${today()}.xlsx`)}
async function tpl(){const X=await xlsx();const ws=X.utils.aoa_to_sheet([ALL.map(a=>a[1])]);const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Customers');X.writeFile(wb,'passbook-format.xlsx')}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function imp(ev){const f=ev.target.files[0];if(!f)return;const X=await xlsx();const wb=X.read(await f.arrayBuffer());const js=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
 const map={};const alias={cust_id:['customerid','custid','cif'],name:['accholder','name','accountholder','customername'],acc_no:['accountno','accno','accountnumber'],joint:['jointholder'],co:['address1co','address1','co','address'],addr2:['address2'],addr3:['address3'],addr4:['statepin','pin','address4'],opened:['openedonddmmyyyy','openedon','opened','openingdate'],operated:['operatedby'],nominee:['nominee'],uid:['uidaadhaarno','uid','aadhaar','aadhar','uidno'],pan:['pannumber','pan'],mobile:['mobileno','mobile','phone']};
 const heads=Object.keys(js[0]||{});for(const[k,al]of Object.entries(alias)){const h=heads.find(h=>al.includes(norm(h)));if(h)map[k]=h}
 if(!map.name&&!map.acc_no)return $('ir').innerHTML='<p style="color:#b42318">Column naam samajh nahi aaye. "Khali Excel format" download karke usi mein bharein.</p>';
 const byAcc=Object.fromEntries(CUST.filter(c=>c.acc_no).map(c=>[c.acc_no,c.id]));const out=[];
 for(const r of js){const c={};for(const k in map)c[k]=String(r[map[k]]).trim();if(!c.name&&!c.acc_no)continue;if(!c.operated)c.operated='SELF';
  const data={};F.forEach(([k])=>data[k]=c[k]||'');const e={};FE.forEach(([k])=>e[k]=c[k]||'');out.push({id:byAcc[c.acc_no]||crypto.randomUUID(),data,enc:await enc(DK,te.encode(JSON.stringify(e)))})}
 if(!out.length)return toast('Koi row nahi mili');if(!confirm(out.length+' customer import karein?'))return;
 try{for(let i=0;i<out.length;i+=200){$('ir').textContent='Import… '+Math.min(i+200,out.length)+'/'+out.length;await rpc('pb_save',{p_token:S.token,p_rows:out.slice(i,i+200)})}}catch(x){if(x.message!=='stop')toast(x.message);return}
 await loadC();$('ir').innerHTML='<p style="color:#0f7a4a">'+out.length+' customer import ho gaye.</p>'}
// ---------- boot ----------
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{if(await restore()){try{await start()}catch(e){}}else loginView()})();
</script></body></html>
