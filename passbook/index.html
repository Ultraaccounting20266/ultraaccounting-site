function pdfParse(T){const ls=T.split('\n').map(s=>s.replace(/\s+$/,''));const U=s=>String(s||'').replace(/\s+/g,' ').trim().toUpperCase();
 const val=(re)=>{for(const l of ls){const m=l.match(re);if(m)return m[1].trim()}return ''};
 const o={};o.name=U(val(/^\s*Customer Name\s{2,}(.+)/i));o.acc_no=val(/^\s*Account No\s{2,}(\d{6,})/i);o.cust_id=U(val(/^\s*Customer ID\s{2,}(\S+)/i));
 o.uid=U(val(/^\s*Aadhaar No\s{2,}([X\d ]{8,})/i)).replace(/\s/g,'');o.mobile=val(/^\s*Mobile No\s{2,}(\d{10})/i)||val(/^\s*Tel\.No.*?\s{2,}(\d{10})/i);
 const sex=U(val(/^\s*Sex\s{2,}(\S+)/i));const gu=U(val(/Name of Father \/ Guardian\s{2,}(.+)/i));const sp=U(val(/Name of Spouse.*?\)\s{2,}(.+)/i));const ms=U(val(/Marital Status\s{2,}(\S+)/i));
 o.title=sex==='FEMALE'?(ms==='MARRIED'?'MRS':'MS'):'MR';if(sex==='FEMALE'&&ms==='MARRIED'&&sp){o.gprefix='W/O';o.gname=sp}else if(gu){o.gprefix=sex==='FEMALE'?'D/O':'S/O';o.gname=gu}o.dob=val(/^\s*Date of Birth\s{2,}(\d{2}-\d{2}-\d{4})/i);o.occupation=U(val(/^\s*Occupation Type\s{2,}(\S+)/i));if(!OPT.occupation.includes(o.occupation))o.occupation='OTHERS';
 const pan=U(val(/PAN \/ GIR no.*?\s{2,}([A-Z]{5}\d{4}[A-Z])/i));if(pan)o.pan=pan;
 const a0=ls.findIndex(l=>/ADDRESS\s*:/i.test(l));let ad='';if(a0>=0){const blk=[];for(let j=a0;j<ls.length&&j<a0+10;j++){if(j>a0&&/Tel\.No|^\s*Email|CUSTOMER PROFILE/i.test(ls[j]))break;blk.push(ls[j])}
  ad=blk.join(' ').replace(/.*ADDRESS\s*:/i,'').replace(/Flat No\.\/Bldg\. Name|Street \/ Road \/ Locality|City \/ District \/ State with pincode/gi,' ')}
 ad=ad.replace(/C\/O\s*:?[^,]*,?/i,'');const pin=(ad.match(/\b(\d{6})\b/)||[])[1]||'';ad=ad.replace(/\b\d{6}\b/,'');
 const parts=ad.split(',').map(s=>s.replace(/\s*-\s*/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);let vill='',po='',dist='',st='',rest=[];
 parts.forEach(p=>{let m;if(m=p.match(/^(?:Village|Vill\.?)\s+(.+)/i))vill=m[1];else if(m=p.match(/^(?:Post|PO|P\.O\.?)\s+(.+)/i))po=m[1];else if(m=p.match(/^(?:Dist|District)\.?\s+(.+)/i))dist=m[1];else if(/bengal|bihar|jharkhand|assam|odisha|pradesh/i.test(p))st=p;else rest.push(p)});
 o.vill=U(vill?'VILL '+vill:rest.shift()||'');o.post=U([po&&'PO '+po,...rest].filter(Boolean).join(', '));o.dist=U(dist);o.state=U(st);o.pin=pin;
 const ft=T.match(/\d+ of \d+\s+(\d{2}-\d{2}-\d{4})/);if(ft)o.opened=ft[1];
 const i=ls.findIndex(l=>/minority of nominee/i.test(l));if(i>=0){const R=/^(FATHER|MOTHER|HUSBAND|WIFE|SON|DAUGHTER|BROTHER|SISTER|GRANDFATHER|GRANDMOTHER|UNCLE|AUNT|OTHERS?|GUARDIAN|SPOUSE)$/i;let nm=[],rel='';
  for(let j=i+1;j<ls.length&&j<i+12;j++){const l=ls[j].trim();if(!l)continue;if(/^(Date|Place)\s*:/i.test(l)||/WITNESS/i.test(l))break;l.split(/\s{2,}/).forEach(t=>{if(R.test(t))rel=t;else if(/^[A-Za-z .]+$/.test(t))nm.push(t)})}
  if(nm.length)o.nominee=U(nm.join(' '))}
 o.nomination=o.nominee?'REGISTERED':'NOT REGISTERED';o.operated=U(val(/Mode of Operation\s*:\s*(\S+)/i))||'SELF';
 Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o}

let PJ=null;async function pdfjs(){if(PJ)return PJ;const V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await new Promise((ok,no)=>{const s=document.createElement('script');s.src=V+'pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js';return PJ=window.pdfjsLib}
async function pdfText(buf){const P=await pdfjs();const doc=await P.getDocument({data:buf}).promise;let out=[];
 for(let n=1;n<=doc.numPages;n++){const tc=await (await doc.getPage(n)).getTextContent();const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width}));it.sort((a,b)=>b.y-a.y||a.x-b.x);
  const L=[];it.forEach(i=>{let l=L.find(l=>Math.abs(l.y-i.y)<3);if(!l)L.push(l={y:i.y,a:[]});l.a.push(i)});L.sort((a,b)=>b.y-a.y);
  L.forEach(l=>{l.a.sort((a,b)=>a.x-b.x);let t='',e=null;l.a.forEach(i=>{if(e!==null){const g=i.x-e;t+=g>8?'   ':(g>1||!/\s$/.test(t))&&!/^\s/.test(i.s)?' ':''}t+=i.s;e=i.x+i.w});out.push('          '+t)})}
 return out.join('\n')}

// ---------- excel ----------
let XL=null;async function xlsx(){if(XL)return XL;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return XL=window.XLSX}
const ALL=[...F,...FE];
function bkView(){hdr();$('app').innerHTML=`<div class="card"><h3 style="margin-top:0">Excel / Backup</h3>
 <div class="row"><button onclick="exp()">⬇ All customers to Excel (backup)</button><button class="o" onclick="tpl()">Blank Excel format</button></div>
 <p class="muted">The backup file goes to your computer's Downloads folder. Keep a copy on a pendrive or Google Drive too.</p>
 <h3>Import from Excel</h3><input type="file" id="xf" accept=".xlsx,.xls,.csv"><p class="muted">First row must have column names: ${ALL.map(a=>a[1]).join(', ')}. If the account no. already exists it is updated, otherwise a new customer is added.</p><div id="ir"></div></div>`;
 $('xf').onchange=imp}
async function exp(){const X=await xlsx();const rows=CUST.map(c=>Object.fromEntries(ALL.map(([k,l])=>[l,c[k]||''])));const ws=X.utils.json_to_sheet(rows,{header:ALL.map(a=>a[1])});const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Customers');X.writeFile(wb,`passbook-${S.code}-${today()}.xlsx`)}
async function tpl(){const X=await xlsx();const ws=X.utils.aoa_to_sheet([ALL.map(a=>a[1])]);const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Customers');X.writeFile(wb,'passbook-format.xlsx')}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function imp(ev){const f=ev.target.files[0];if(!f)return;const X=await xlsx();const wb=X.read(await f.arrayBuffer());const js=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
 const map={};const alias={cust_id:['cifcustomerid','customerid','custid','cif','cifno'],name:['customername','accholder','name','accountholder'],acc_no:['acno','accountno','accno','accountnumber'],joint:['jointholder'],title:['title'],dob:['dob'],gprefix:['guardianprefix','careofprefix'],gname:['guardianname','careofname'],vill:['address1village','address1','village'],post:['address2post','address2','post'],dist:['districtcity','district'],pin:['pincode','pin'],state:['state'],email:['email','customeremailid'],ckyc:['ckycno','ckyc'],acctype:['accounttype'],nomination:['nomination'],delivery:['passbookdeliverydate'],issue:['issuedate'],occupation:['occupation'],deposit:['initialdeposit'],remarks:['remarks'],apy:['apy'],pmsby:['pmsby'],pmjjy:['pmjjy'],opened:['openedonddmmyyyy','openedon','opened','openingdate'],operated:['operatedby'],nominee:['nomineename','nominee'],uid:['aadhaarno','uidaadhaarno','uid','aadhaar','aadhar','uidno'],pan:['panno','pannumber','pan'],mobile:['mobileno','mobile','phone']};
 const heads=Object.keys(js[0]||{});for(const[k,al]of Object.entries(alias)){const h=heads.find(h=>al.includes(norm(h)));if(h)map[k]=h}
 if(!map.name&&!map.acc_no)return $('ir').innerHTML='<p style="color:#b42318">Column names not recognised. Download "Blank Excel format" and fill your data in it.</p>';
 const byAcc=Object.fromEntries(CUST.filter(c=>c.acc_no).map(c=>[c.acc_no,c.id]));const out=[];
 for(const r of js){const c={};for(const k in map)c[k]=String(r[map[k]]).trim();if(!c.name&&!c.acc_no)continue;if(!c.operated)c.operated='SELF';
  const data={};F.forEach(([k])=>data[k]=c[k]||'');const e={};FE.forEach(([k])=>e[k]=c[k]||'');out.push({id:byAcc[c.acc_no]||crypto.randomUUID(),data,enc:await enc(DK,te.encode(JSON.stringify(e)))})}
 if(!out.length)return toast('No rows found');if(!confirm(out.length+' customers will be imported. Continue?'))return;
 try{for(let i=0;i<out.length;i+=200){$('ir').textContent='Importing… '+Math.min(i+200,out.length)+'/'+out.length;await rpc('pb_save',{p_token:S.token,p_rows:out.slice(i,i+200)})}}catch(x){if(x.message!=='stop')toast(x.message);return}
 await loadC();$('ir').innerHTML='<p style="color:#0f7a4a">'+out.length+' customers imported.</p>'}
// ---------- boot ----------
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{if(await restore()){try{await start()}catch(e){}}else loginView()})();
